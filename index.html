            gl_FragColor = vec4(coreColor * (0.48 + vPulse * 1.25), glow * uOpacity);
          }
        `
      });

      fireflies = new THREE.Points(geo, fireflyMaterial);
      fireflies.frustumCulled = false;
      fireflies.visible = false;
      fireflies.renderOrder = 2;
      walkStageGroup.add(fireflies);
    }

    // Estela de polvo fino del giroscopio al flotar (brillo contenido para distinguir con nitidez el objeto y su movimiento)
    function setupGyroTrailParticles() {
      const geo = new THREE.BufferGeometry();
      trailPositions = new Float32Array(TRAIL_COUNT * 3);
      trailLives = new Float32Array(TRAIL_COUNT);
      trailMaxLives = new Float32Array(TRAIL_COUNT);
      trailSizes = new Float32Array(TRAIL_COUNT);
      trailPhases = new Float32Array(TRAIL_COUNT);

      for (let i = 0; i < TRAIL_COUNT; i++) {
        trailLives[i] = 0;
        trailMaxLives[i] = 1;
        trailSizes[i] = 4.5 + Math.random() * 5.2;
        trailPhases[i] = Math.random() * Math.PI * 2;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
      geo.setAttribute('aLife', new THREE.BufferAttribute(trailLives, 1));
      geo.setAttribute('aSize', new THREE.BufferAttribute(trailSizes, 1));
      geo.setAttribute('aPhase', new THREE.BufferAttribute(trailPhases, 1));

      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        toneMapped: false,
        uniforms: {
          uTime: { value: 0 },
          uPixelRatio: { value: renderer.getPixelRatio() }
        },
        vertexShader: `
          attribute float aLife;
          attribute float aSize;
          attribute float aPhase;
          uniform float uTime;
          uniform float uPixelRatio;
          varying float vLife;
          varying float vTwinkle;
          void main() {
            vLife = aLife;
            vTwinkle = 0.65 + 0.35 * sin(uTime * 9.0 + aPhase * 5.0);
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            float size = aSize * (0.35 + 0.65 * aLife);
            gl_PointSize = clamp((size * uPixelRatio) / max(-mvPosition.z, 0.45), 1.0, 14.0) * step(0.005, aLife);
          }
        `,
        fragmentShader: `
          varying float vLife;
          varying float vTwinkle;
          void main() {
            if (vLife <= 0.005) discard;
            vec2 p = (gl_PointCoord - vec2(0.5)) * 2.0;
            float d = length(p);
            float core = exp(-d * d * 9.5);
            float crossStar = max(0.0, 1.0 - abs(p.x * p.y) * 20.0) * exp(-d * d * 3.8);
            float alpha = (core * 0.50 + crossStar * 0.26) * (vLife * vLife) * vTwinkle * 0.64;
            if (alpha < 0.008) discard;
            vec3 col = mix(vec3(0.95, 0.72, 0.22), vec3(1.0, 0.94, 0.72), core);
            gl_FragColor = vec4(col * 0.90, alpha);
          }
        `
      });

      trailPoints = new THREE.Points(geo, mat);
      trailPoints.frustumCulled = false;
      trailPoints.visible = false;
      trailPoints.renderOrder = 3;
      interiorGroup.add(trailPoints);
    }

    function updateGyroTrail(dt, timeSec, emitPos, spawnRateSec = 0.013) {
      if (!trailPoints) return;
      trailPoints.material.uniforms.uTime.value = timeSec;

      let anyAlive = false;
      for (let i = 0; i < TRAIL_COUNT; i++) {
        if (trailLives[i] > 0) {
          trailLives[i] = Math.max(0, trailLives[i] - dt / trailMaxLives[i]);
          trailPositions[i * 3] += Math.cos(timeSec * 2.2 + trailPhases[i]) * dt * 0.025;
          trailPositions[i * 3 + 1] += dt * 0.072;
          trailPositions[i * 3 + 2] += Math.sin(timeSec * 2.2 + trailPhases[i]) * dt * 0.025;
          if (trailLives[i] > 0) anyAlive = true;
        }
      }

      if (emitPos) {
        trailSpawnAccum += dt;
        while (trailSpawnAccum >= spawnRateSec) {
          trailSpawnAccum -= spawnRateSec;
          const idx = trailCursor;
          trailCursor = (trailCursor + 1) % TRAIL_COUNT;

          const a = Math.random() * Math.PI * 2;
          const r = 0.14 + Math.random() * 0.10;
          trailPositions[idx * 3] = emitPos.x + Math.cos(a) * r;
          trailPositions[idx * 3 + 1] = emitPos.y + (Math.random() - 0.5) * 0.16;
          trailPositions[idx * 3 + 2] = emitPos.z + Math.sin(a) * r;
          trailMaxLives[idx] = 1.05 + Math.random() * 0.65;
          trailLives[idx] = 1.0;
          trailSizes[idx] = 4.2 + Math.random() * 5.0;
          trailPhases[idx] = Math.random() * Math.PI * 2;
          anyAlive = true;
        }
      }

      trailPoints.visible = anyAlive;
      if (anyAlive) {
        trailPoints.geometry.attributes.position.needsUpdate = true;
        trailPoints.geometry.attributes.aLife.needsUpdate = true;
        trailPoints.geometry.attributes.aSize.needsUpdate = true;
      }
    }

    // --- FLUJO DE TRANSFERENCIA DE ESENCIA DE VIDA (GIROSCOPIO -> ESCULTURA) ---
    function setupTransferStreamParticles() {
      const geo = new THREE.BufferGeometry();
      transferPositions = new Float32Array(TRANSFER_COUNT * 3);
      transferProgress = new Float32Array(TRANSFER_COUNT);
      transferSpeeds = new Float32Array(TRANSFER_COUNT);
      transferSizes = new Float32Array(TRANSFER_COUNT);
      transferOffsets = new Float32Array(TRANSFER_COUNT * 3);
      transferTargets = new Float32Array(TRANSFER_COUNT * 3);

      for (let i = 0; i < TRANSFER_COUNT; i++) {
        transferProgress[i] = Math.random();
        transferSpeeds[i] = 0.55 + Math.random() * 0.68;
        transferSizes[i] = 7.5 + Math.random() * 10.5;
        const angle = Math.random() * Math.PI * 2;
        const rad = 0.22 + Math.random() * 0.45;
        transferOffsets[i * 3] = Math.cos(angle) * rad;
        transferOffsets[i * 3 + 1] = 0.18 + Math.random() * 0.55;
        transferOffsets[i * 3 + 2] = Math.sin(angle) * rad;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(transferPositions, 3));
      geo.setAttribute('aProg', new THREE.BufferAttribute(transferProgress, 1));
      geo.setAttribute('aSize', new THREE.BufferAttribute(transferSizes, 1));

      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        toneMapped: false,
        uniforms: {
          uFade: { value: 0 },
          uPixelRatio: { value: renderer.getPixelRatio() }
        },
        vertexShader: `
          attribute float aProg;
          attribute float aSize;
          uniform float uFade;
          uniform float uPixelRatio;
          varying float vAlpha;
          varying float vProg;
          void main() {
            vProg = aProg;
            float edge = smoothstep(0.0, 0.15, aProg) * (1.0 - smoothstep(0.84, 1.0, aProg));
            vAlpha = edge * uFade;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            float s = aSize * (0.65 + 0.55 * sin(aProg * 3.14159));
            gl_PointSize = clamp((s * uPixelRatio) / max(-mvPosition.z, 0.45), 1.5, 21.0) * step(0.01, vAlpha);
          }
        `,
        fragmentShader: `
          varying float vAlpha;
          varying float vProg;
          void main() {
            if (vAlpha < 0.01) discard;
            vec2 p = (gl_PointCoord - vec2(0.5)) * 2.0;
            float d = length(p);
            float core = exp(-d * d * 7.2);
            float star = max(0.0, 1.0 - abs(p.x * p.y) * 18.0) * exp(-d * d * 3.0);
            float a = (core * 0.90 + star * 0.42) * vAlpha;
            if (a < 0.01) discard;
            vec3 goldEssence = mix(vec3(1.0, 0.80, 0.22), vec3(0.86, 1.0, 0.60), vProg * 0.45);
            vec3 col = mix(goldEssence, vec3(1.0, 0.99, 0.88), core * 0.72);
            gl_FragColor = vec4(col * 1.40, a);
          }
        `
      });

      transferPoints = new THREE.Points(geo, mat);
      transferPoints.frustumCulled = false;
      transferPoints.visible = false;
      transferPoints.renderOrder = 4;
      interiorGroup.add(transferPoints);
    }

    function initTransferTargets() {
      for (let i = 0; i < TRANSFER_COUNT; i++) {
        transferTargets[i * 3] = sculptureCenterLocal.x + (Math.random() - 0.5) * sculptureSizeLocal.x * 0.58;
        transferTargets[i * 3 + 1] = sculptureLocalBox.min.y + 0.14 + Math.random() * Math.max(0.4, sculptureSizeLocal.y * 0.84);
        transferTargets[i * 3 + 2] = sculptureCenterLocal.z + (Math.random() - 0.5) * sculptureSizeLocal.z * 0.58;
        transferProgress[i] = Math.random();
      }
      transferStreamActive = true;
      transferStreamFade = 0;
      if (transferPoints) transferPoints.visible = true;
    }

    function updateTransferStream(dt, timeSec, originPos) {
      if (!transferStreamActive || !transferPoints) return;

      let targetFade = 0;
      if (awakeningElapsed < 0.45) {
        targetFade = awakeningElapsed / 0.45;
      } else if (awakeningElapsed < 4.2) {
        targetFade = 1.0;
      } else if (awakeningElapsed < 5.6) {
        targetFade = 1.0 - (awakeningElapsed - 4.2) / 1.4;
      } else {
        targetFade = 0;
        transferStreamActive = false;
        transferPoints.visible = false;
        return;
      }

      transferStreamFade = THREE.MathUtils.clamp(targetFade, 0, 1);
      transferPoints.material.uniforms.uFade.value = transferStreamFade;

      for (let i = 0; i < TRANSFER_COUNT; i++) {
        let t = transferProgress[i] + dt * transferSpeeds[i];
        if (t >= 1.0) {
          t -= 1.0;
          transferTargets[i * 3] = sculptureCenterLocal.x + (Math.random() - 0.5) * sculptureSizeLocal.x * 0.58;
          transferTargets[i * 3 + 1] = sculptureLocalBox.min.y + 0.14 + Math.random() * Math.max(0.4, sculptureSizeLocal.y * 0.84);
          transferTargets[i * 3 + 2] = sculptureCenterLocal.z + (Math.random() - 0.5) * sculptureSizeLocal.z * 0.58;
        }
        transferProgress[i] = t;

        const tx = transferTargets[i * 3];
        const ty = transferTargets[i * 3 + 1];
        const tz = transferTargets[i * 3 + 2];

        const swirl = timeSec * 2.2 + i * 0.37;
        _midCtrl.set(
          (originPos.x + tx) * 0.5 + transferOffsets[i * 3] * Math.cos(swirl * 0.35),
          (originPos.y + ty) * 0.5 + transferOffsets[i * 3 + 1],
          (originPos.z + tz) * 0.5 + transferOffsets[i * 3 + 2] * Math.sin(swirl * 0.35)
        );

        const inv = 1.0 - t;
        const b0 = inv * inv;
        const b1 = 2.0 * inv * t;
        const b2 = t * t;

        transferPositions[i * 3] = b0 * originPos.x + b1 * _midCtrl.x + b2 * tx;
        transferPositions[i * 3 + 1] = b0 * originPos.y + b1 * _midCtrl.y + b2 * ty;
        transferPositions[i * 3 + 2] = b0 * originPos.z + b1 * _midCtrl.z + b2 * tz;
      }

      transferPoints.geometry.attributes.position.needsUpdate = true;
      transferPoints.geometry.attributes.aProg.needsUpdate = true;
    }

    // --- PARTÍCULAS LUMINOSAS CUBRIENDO Y RODEANDO LA ESCULTURA (ARENA MÁGICA PERMANENTE, 1 DRAW CALL) ---
    function setupMagicSandParticles(sculptureObj, centerLocal, radiusXZ, minY, height) {
      // Muestrear puntos reales sobre la superficie de la escultura para envolver su silueta con fidelidad
      const surfacePool = [];
      const tempV = new THREE.Vector3();
      sculptureObj.traverse((child) => {
        if (child.isMesh && child.visible && child.geometry?.attributes?.position) {
          const posAttr = child.geometry.attributes.position;
          const step = Math.max(1, Math.floor(posAttr.count / 900));
          for (let i = 0; i < posAttr.count; i += step) {
            tempV.set(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
            tempV.applyMatrix4(child.matrixWorld);
            surfacePool.push(tempV.clone());
          }
        }
      });

      const surfaceCount = 580; // Cubren de cerca la forma de la escultura
      const haloCount = 340;    // Flotan alrededor como arena mágica suspendida
      const totalCount = surfaceCount + haloCount;

      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(totalCount * 3);
      const seeds = new Float32Array(totalCount * 4);
      const layers = new Float32Array(totalCount); // 0 = manto sobre escultura, 1 = arena mágica alrededor
      const colors = new Float32Array(totalCount * 3);

      const sandPalette = [
        new THREE.Color('#fde68a'),
        new THREE.Color('#fef3c7'),
        new THREE.Color('#facc15'),
        new THREE.Color('#d9f99d'),
        new THREE.Color('#fffbeb')
      ];

      const outDir = new THREE.Vector3();
      for (let i = 0; i < totalCount; i++) {
        const isHalo = i >= surfaceCount;
        layers[i] = isHalo ? 1.0 : 0.0;

        if (!isHalo && surfacePool.length > 0) {
          const pt = surfacePool[Math.floor(Math.random() * surfacePool.length)];
          outDir.subVectors(pt, centerLocal);
          if (outDir.lengthSq() > 0.0001) outDir.normalize();
          else outDir.set(Math.random() - 0.5, 0.2, Math.random() - 0.5).normalize();

          const shellOffset = 0.025 + Math.random() * 0.11;
          positions[i * 3] = pt.x + outDir.x * shellOffset + (Math.random() - 0.5) * 0.05;
          positions[i * 3 + 1] = pt.y + outDir.y * (shellOffset * 0.65) + (Math.random() - 0.5) * 0.05;
          positions[i * 3 + 2] = pt.z + outDir.z * shellOffset + (Math.random() - 0.5) * 0.05;

          seeds[i * 4] = Math.random() * Math.PI * 2;
          seeds[i * 4 + 1] = 0.45 + Math.random() * 0.65;
          seeds[i * 4 + 2] = 5.5 + Math.random() * 7.5;   // grano fino y nítido
          seeds[i * 4 + 3] = 0.025 + Math.random() * 0.055; // vaivén corto pegado a la escultura
        } else {
          const angle = Math.random() * Math.PI * 2;
          const r = 0.26 + Math.random() * (radiusXZ + 0.55);
          positions[i * 3] = centerLocal.x + Math.cos(angle) * r;
          positions[i * 3 + 1] = minY + Math.random() * (height + 0.68);
          positions[i * 3 + 2] = centerLocal.z + Math.sin(angle) * r;

          seeds[i * 4] = Math.random() * Math.PI * 2;
          seeds[i * 4 + 1] = 0.16 + Math.random() * 0.34;
          seeds[i * 4 + 2] = 6.0 + Math.random() * 8.5;
          seeds[i * 4 + 3] = 0.08 + Math.random() * 0.20;
        }

        const c = sandPalette[Math.floor(Math.random() * sandPalette.length)];
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 4));
      geo.setAttribute('aLayer', new THREE.BufferAttribute(layers, 1));
      geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));

      magicSandMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        toneMapped: false,
        uniforms: {
          uTime: { value: 0 },
          uIntensity: { value: 0 },
          uSpeakingBoost: { value: 0 },
          uMinY: { value: minY },
          uSpanY: { value: height + 0.85 },
          uPixelRatio: { value: renderer.getPixelRatio() }
        },
        vertexShader: `
          attribute vec4 aSeed;
          attribute float aLayer;
          attribute vec3 aColor;
          uniform float uTime;
          uniform float uIntensity;
          uniform float uSpeakingBoost;
          uniform float uMinY;
          uniform float uSpanY;
          uniform float uPixelRatio;
          varying float vAlpha;
          varying vec3 vColor;
          void main() {
            vColor = aColor;
            vec3 pos = position;
            float phase = aSeed.x;
            float speed = aSeed.y;
            float drift = aSeed.w;

            float heightFade = 1.0;
            if (aLayer < 0.5) {
              // Manto luminoso pegado a la escultura: flotación delicada y respiración orgánica
              float t = uTime * (0.9 + speed * 0.55) + phase;
              pos.x += cos(t) * drift;
              pos.y += sin(t * 1.15 + phase) * (drift * 1.35) + 0.02 * sin(uTime * 0.7 + phase);
              pos.z += sin(t * 0.92 + phase * 1.3) * drift;
            } else {
              // Arena mágica flotando alrededor de la escultura
              float localY = mod((pos.y - uMinY) + uTime * speed * 0.30, uSpanY);
              pos.y = uMinY + localY + sin(uTime * 1.1 + phase * 2.0) * 0.055;
              float swirl = uTime * 0.40 + phase + localY * 0.52;
              pos.x += cos(swirl) * drift;
              pos.z += sin(swirl) * drift;
              heightFade = smoothstep(0.0, 0.25, localY) * (1.0 - smoothstep(uSpanY * 0.78, uSpanY, localY));
            }

            float twinkleFreq = 3.6 + uSpeakingBoost * 1.4;
            float sparkle = 0.44 + 0.56 * pow(0.5 + 0.5 * sin(uTime * twinkleFreq + phase * 5.0), 2.0);
            vAlpha = heightFade * sparkle * uIntensity;

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            float sizeBoost = 1.0 + uSpeakingBoost * 0.14;
            gl_PointSize = clamp((aSeed.z * sizeBoost * uPixelRatio) / max(-mvPosition.z, 0.48), 1.5, 16.0);
          }
        `,
        fragmentShader: `
          varying float vAlpha;
          varying vec3 vColor;
          void main() {
            if (vAlpha < 0.01) discard;
            vec2 p = (gl_PointCoord - vec2(0.5)) * 2.0;
            float d = length(p);
            float grain = exp(-d * d * 8.2);
            float glint = max(0.0, 1.0 - abs(p.x * p.y) * 22.0) * exp(-d * d * 3.4);
            float a = (grain * 0.86 + glint * 0.42) * vAlpha;
            if (a < 0.01) discard;
            vec3 col = mix(vColor, vec3(1.0, 0.99, 0.90), grain * 0.62);
            gl_FragColor = vec4(col * 1.32, a);
          }
        `
      });

      magicSandPoints = new THREE.Points(geo, magicSandMat);
      magicSandPoints.frustumCulled = false;
      magicSandPoints.visible = false;
      magicSandPoints.renderOrder = 3;
      interiorGroup.add(magicSandPoints);
    }

    function fixCorridorMaterial(mat, maxAnisotropy) {
      if (!mat) return;
      const name = (mat.name || '').toLowerCase();
      const cutoutNames = ['alexandrapalm', 'wild bush', 'plantas', 'plant.leaf', 'rejapared', 'leaves', 'orchid', 'sepal'];
      const isCutout = cutoutNames.some(k => name.includes(k));
      if (isCutout) { mat.transparent = false; mat.alphaTest = 0.42; mat.depthWrite = true; mat.side = THREE.DoubleSide; }
      else { mat.transparent = false; mat.alphaTest = 0; mat.depthWrite = true; mat.side = THREE.FrontSide; }
      ['map', 'normalMap', 'roughnessMap', 'metalnessMap'].forEach((mapKey) => { if (mat[mapKey]) mat[mapKey].anisotropy = maxAnisotropy; });
    }

    // Raycast auxiliar sobre la superficie superior real del suelo del pasillo
    function sampleFloorSurfaceY(meshes, x, z, fallbackY = 0) {
      if (!meshes || meshes.length === 0) return fallbackY;
      const rc = new THREE.Raycaster(new THREE.Vector3(x, 3.2, z), new THREE.Vector3(0, -1, 0), 0, 8.0);
      const hits = rc.intersectObjects(meshes, false);
      for (const h of hits) {
        if (h.point.y < 1.8) return h.point.y;
      }
      return fallbackY;
    }

    // Raycast auxiliar hacia el muro izquierdo o derecho interior
    function sampleSideWallInnerX(meshes, z, dirX, fallbackX) {
      if (!meshes || meshes.length === 0) return fallbackX;
      const rc = new THREE.Raycaster(new THREE.Vector3(0, 1.05, z), new THREE.Vector3(dirX, 0, 0), 0.1, 6.0);
      const hits = rc.intersectObjects(meshes, false);
      if (hits.length > 0) return hits[0].point.x;
      return fallbackX;
    }

    async function loadModelsParallel() {
      await MeshoptDecoder.ready;
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      gltfLoader = new GLTFLoader();
      gltfLoader.setDRACOLoader(dracoLoader);
      gltfLoader.setMeshoptDecoder(MeshoptDecoder);

      const progressMap = { corridor: 0, sculpture: 0, gyroscope: 0 };
      const updateUIProgress = () => {
        const total = Math.min(99, Math.round((progressMap.corridor * 0.65) + (progressMap.sculpture * 0.25) + (progressMap.gyroscope * 0.10)));
        document.getElementById('progress-bar').style.width = total + '%';
        document.getElementById('progress-text').textContent = total + '%';
      };

      const loadWithProgress = (url, key) => new Promise((resolve, reject) => {
        gltfLoader.load(url, (gltf) => { progressMap[key] = 100; updateUIProgress(); resolve(gltf); },
          (xhr) => { if (xhr.total > 0) { progressMap[key] = (xhr.loaded / xhr.total) * 100; updateUIProgress(); } }, reject);
      });

      try {
        const [gltfCorridor, gltfSculpture, gltfGyro] = await Promise.all([
          loadWithProgress(MODELS.corridor, 'corridor'),
          loadWithProgress(MODELS.sculpture, 'sculpture'),
          loadWithProgress(MODELS.gyroscope, 'gyroscope')
        ]);

        // 1. PASILLO (Alineado a la cara SUPERIOR caminable del suelo)
        const corridor = gltfCorridor.scene;
        corridor.scale.setScalar(5.2);
        corridor.updateMatrixWorld(true);

        const pisoSlabBox = new THREE.Box3();
        const wallBox = new THREE.Box3();
        const pisoMeshes = [];
        const wallMeshes = [];
        const allCorridorMeshes = [];
        let hasPisoSlab = false;
        let hasWallMesh = false;

        corridor.traverse((node) => {
          if (node.isMesh) {
            allCorridorMeshes.push(node);
            const mName = (node.name || '').toLowerCase();
            const matName = (node.material?.name || '').toLowerCase();
            if (mName.includes('pisoceart') || matName.includes('pisoceart') || mName.includes('piso')) {
              pisoSlabBox.expandByObject(node);
              pisoMeshes.push(node);
              hasPisoSlab = true;
            }
            if (mName.includes('muro') || matName.includes('murocear') || mName.includes('pared')) {
              wallBox.expandByObject(node);
              wallMeshes.push(node);
              hasWallMesh = true;
            }
          }
        });

        const fullCorrBox = new THREE.Box3().setFromObject(corridor);
        const refCenter = hasWallMesh ? wallBox.getCenter(new THREE.Vector3()) : fullCorrBox.getCenter(new THREE.Vector3());
        const entranceZ = hasWallMesh ? wallBox.max.z : fullCorrBox.max.z;
        const backZ = hasWallMesh ? wallBox.min.z : fullCorrBox.min.z;
        totalCorridorLength = Math.abs(entranceZ - backZ);
        const corridorWidth = hasWallMesh ? (wallBox.max.x - wallBox.min.x) : (fullCorrBox.max.x - fullCorrBox.min.x);

        const slabHeight = hasPisoSlab ? (pisoSlabBox.max.y - pisoSlabBox.min.y) : 0;
        const initialFloorRefY = (hasPisoSlab && slabHeight > 0 && slabHeight < 1.2)
          ? pisoSlabBox.max.y
          : (hasPisoSlab ? pisoSlabBox.min.y : fullCorrBox.min.y);

        corridor.position.set(-refCenter.x, -initialFloorRefY, -entranceZ);
        corridor.updateMatrixWorld(true);

        // Afinar la superficie exacta del suelo caminable mediante raycast descendente
        const floorTargets = pisoMeshes.length > 0 ? pisoMeshes : allCorridorMeshes;
        const floorSamples = [
          sampleFloorSurfaceY(floorTargets, 0, -(totalCorridorLength * 0.25), null),
          sampleFloorSurfaceY(floorTargets, 0, -(totalCorridorLength * 0.50), null),
          sampleFloorSurfaceY(floorTargets, 0, -(totalCorridorLength * 0.68), null)
        ].filter((v) => v !== null && Math.abs(v) < 1.8);

        if (floorSamples.length > 0) {
          floorSamples.sort((a, b) => a - b);
          const medianFloorY = floorSamples[Math.floor(floorSamples.length / 2)];
          corridor.position.y -= medianFloorY;
          corridor.updateMatrixWorld(true);
        }

        // Localizar referencia de la reja del fondo para colocar el objeto mágico DELANTE (de este lado)
        const rejaBox = new THREE.Box3();
        let hasReja = false;
        corridor.traverse((node) => {
          if (node.isMesh) {
            const mName = (node.name || '').toLowerCase();
            const matName = (node.material?.name || '').toLowerCase();
            if (mName.includes('reja') || matName.includes('reja')) {
              rejaBox.expandByObject(node);
              hasReja = true;
            }
          }
        });

        // 2. ESCULTURA FELINA (Sobre el suelo del pasillo, sin cortar manos ni patas)
        const sculpture = gltfSculpture.scene;
        sculptureGroup = sculpture;
        sculpture.scale.setScalar(2.6);
        sculpture.updateMatrixWorld(true);

        const sculpBox = new THREE.Box3().setFromObject(sculpture);
        const sculpCenter = sculpBox.getCenter(new THREE.Vector3());
        const sculpRawSize = sculpBox.getSize(new THREE.Vector3());
        const sculptureZ = -(totalCorridorLength * 0.68);

        let fallbackLeftWallX = -2.0;
        let fallbackRightWallX = 2.0;
        if (hasPisoSlab) {
          const pisoW = pisoSlabBox.max.x - pisoSlabBox.min.x;
          if (pisoW >= 2.2 && pisoW <= 6.5) {
            fallbackLeftWallX = pisoSlabBox.min.x + corridor.position.x;
            fallbackRightWallX = pisoSlabBox.max.x + corridor.position.x;
          }
        }
        const detectedLeftWallX = sampleSideWallInnerX(wallMeshes, sculptureZ, -1, fallbackLeftWallX);
        const lateralOffset = THREE.MathUtils.clamp(
          detectedLeftWallX + (sculpRawSize.x * 0.50) + 0.12,
          -2.10,
          -1.15
        );

        const floorYUnderSculpture = Math.max(
          sampleFloorSurfaceY(floorTargets, lateralOffset, sculptureZ, 0.0),
          sampleFloorSurfaceY(floorTargets, lateralOffset + 0.28, sculptureZ, 0.0),
          0.0
        );

        let lowestVisibleY = Infinity;
        sculpture.traverse((child) => {
          if (child.isMesh && child.visible) {
            const posAttr = child.geometry.attributes.position;
            if (posAttr) {
              for (let i = 0; i < posAttr.count; i++) {
                const v = new THREE.Vector3(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
                v.applyMatrix4(child.matrixWorld);
                if (v.y < lowestVisibleY) lowestVisibleY = v.y;
              }
            }
          }
        });
        if (lowestVisibleY === Infinity) lowestVisibleY = sculpBox.min.y;

        sculpture.position.set(
          -sculpCenter.x + lateralOffset,
          (floorYUnderSculpture - lowestVisibleY) + 0.07,
          sculptureZ - sculpCenter.z
        );
        sculpture.updateMatrixWorld(true);

        sculptureLocalBox.setFromObject(sculpture);
        sculptureLocalBox.getCenter(sculptureCenterLocal);
        sculptureLocalBox.getSize(sculptureSizeLocal);
        sculptureOrbitRadius = Math.max(0.72, Math.max(sculptureSizeLocal.x, sculptureSizeLocal.z) * 0.50 + 0.30);

        // Anclar Audio 3 (audio_escultura.mp3 posicional 3D) directamente en el centro de la escultura
        if (narrationTracks.awaken.audio) {
          const audioAnchor = new THREE.Object3D();
          audioAnchor.position.copy(sculptureCenterLocal);
          interiorGroup.add(audioAnchor);
          audioAnchor.add(narrationTracks.awaken.audio);
        }

        sculptureLight = new THREE.PointLight(0xfef3c7, 2.3, 14);
        sculptureLight.position.set(lateralOffset + 0.65, sculptureLocalBox.max.y + 0.35, sculptureZ + 1.35);

        // 3. GIROSCOPIO DORADO (40 cm, DE ESTE LADO DEL PASILLO, delante de la reja del fondo)
        const sharedHaloTexture = createGoldenHaloTexture();
        gyroGroup = new THREE.Group();
        gyroAimPivot = new THREE.Group();
        gyroGroup.add(gyroAimPivot);

        gyroModel = gltfGyro.scene;
        const rawGyroBox = new THREE.Box3().setFromObject(gyroModel);
        const rawGyroSize = rawGyroBox.getSize(new THREE.Vector3());
        const maxDim = Math.max(rawGyroSize.x, rawGyroSize.y, rawGyroSize.z) || 1;
        const targetGyroSize = 0.40;
        gyroModel.scale.setScalar(targetGyroSize / maxDim);
        gyroModel.updateMatrixWorld(true);

        const centeredGyroBox = new THREE.Box3().setFromObject(gyroModel);
        const centeredGyroCenter = centeredGyroBox.getCenter(new THREE.Vector3());
        gyroModel.position.sub(centeredGyroCenter);
        gyroAimPivot.add(gyroModel);

        const haloMat = new THREE.SpriteMaterial({
          map: sharedHaloTexture,
          color: 0xfde68a,
          transparent: true,
          opacity: 0.18,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        gyroHaloSprite = new THREE.Sprite(haloMat);
        gyroHaloSprite.scale.setScalar(0.50);
        gyroHaloSprite.renderOrder = 3;
        gyroGroup.add(gyroHaloSprite);

        const hitGeo = new THREE.SphereGeometry(0.58, 12, 12);
        const hitMat = new THREE.MeshBasicMaterial({ visible: false });
        gyroHitSphere = new THREE.Mesh(hitGeo, hitMat);
        gyroGroup.add(gyroHitSphere);

        gyroLight = new THREE.PointLight(0xfbbf24, 0.85, 4.8);
        gyroGroup.add(gyroLight);

        const seenGyroMats = new Set();
        gyroModel.traverse((node) => {
          if (node.isMesh && node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((mat) => {
              if (!seenGyroMats.has(mat) && 'emissive' in mat) {
                seenGyroMats.add(mat);
                mat.emissive.copy(_goldColor);
                mat.emissiveIntensity = 0.16;
                gyroMaterials.push(mat);
              }
            });
          }
        });

        // Colocar el objeto mágico de este lado del pasillo (frente a la reja, lado derecho, visible y accesible)
        const backLimitZ = hasReja ? rejaBox.min.z : -totalCorridorLength;
        const gyroZ = THREE.MathUtils.clamp(
          backLimitZ + 1.25,
          -(totalCorridorLength * 0.90),
          -(totalCorridorLength * 0.78)
        );
        const detectedRightWallX = sampleSideWallInnerX(wallMeshes, gyroZ, 1, fallbackRightWallX);
        const gyroX = THREE.MathUtils.clamp(
          detectedRightWallX - 0.68,
          0.55,
          Math.min(1.25, (corridorWidth * 0.5) - 0.55)
        );
        const floorYUnderGyro = Math.max(0, sampleFloorSurfaceY(floorTargets, gyroX, gyroZ, 0.0));
        gyroRestPosition.set(gyroX, floorYUnderGyro + 0.95, gyroZ);
        gyroGroup.position.copy(gyroRestPosition);

        interiorGroup.add(corridor, sculpture, sculptureLight, gyroGroup);
        setupMagicSandParticles(sculpture, sculptureCenterLocal, sculptureOrbitRadius, sculptureLocalBox.min.y, sculptureSizeLocal.y);

        const combinedBox = new THREE.Box3().setFromObject(interiorGroup);
        maxRevealHeight = Math.max(10.5, combinedBox.max.y + 0.6);
        leafMaterial.uniforms.uMaxHeight.value = maxRevealHeight;
        magicWaveRing.position.set(0, 0.1, sculptureZ * 0.65);

        const maxAniso = Math.min(4, renderer.capabilities.getMaxAnisotropy());
        const processedMaterials = new Set();
        interiorGroup.traverse((node) => {
          node.frustumCulled = false;
          if (node.isMesh && node.material && node !== gyroHitSphere) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((mat) => {
              if (!processedMaterials.has(mat)) {
                fixCorridorMaterial(mat, maxAniso);
                mat.clippingPlanes = [clippingPlane];
                mat.needsUpdate = true;
                processedMaterials.add(mat);
              }
            });
          }
        });

        dracoLoader.dispose();

        document.getElementById('progress-bar').style.width = '100%';
        document.getElementById('progress-text').textContent = '100%';
        document.getElementById('progress-container').classList.add('hidden');
        document.getElementById('loading-message').textContent = '¡Pasillo, Escultura y Artefacto listos!';
        launchControls.classList.remove('hidden');
        launchControls.classList.add('flex');
        triggerMaterializationWave();
      } catch (e) {
        console.error('Error cargando modelos:', e);
        document.getElementById('loading-message').textContent = 'Error al cargar modelos GLB. Verifica tu conexión.';
      }
    }

    // Dispara intro.mp3 cuando el usuario llega aproximadamente a medio pasillo
    function checkMidCorridorIntroTrigger() {
      if (hasTriggeredMidCorridor || isMaterializing) return;

      const activeCam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
      activeCam.getWorldPosition(_camLocalPos);
      interiorGroup.worldToLocal(_camLocalPos);

      const depthInCorridor = -_camLocalPos.z;
      const midCorridorThreshold = totalCorridorLength * 0.42;

      if (depthInCorridor >= midCorridorThreshold) {
        hasTriggeredMidCorridor = true;
        playNarrativeTrack('intro');
        statusText.textContent = 'Explora el pasillo · Encuentra el objeto mágico';
        showToast('✨ Escuchando introducción...');
      }
    }

    function activateSculptureAwakening() {
      artifactState = ARTIFACT_STATE.ACTIVADO;
      awakeningElapsed = 0;

      orbitAngle = Math.atan2(
        gyroGroup.position.z - sculptureCenterLocal.z,
        gyroGroup.position.x - sculptureCenterLocal.x
      );

      if (carryingController) {
        triggerHaptic(carryingController, 0.9, 260);
      }
      carryingMode = null;
      carryingController = null;

      initTransferTargets();
      if (magicSandPoints) magicSandPoints.visible = true;

      playAwakeningChord();
      playNarrativeTrack('awaken');

      statusDot.className = 'w-2.5 h-2.5 rounded-full bg-amber-300 shadow-[0_0_12px_#fcd34d]';
      statusText.textContent = 'Esencia transferida · Escuchando a la escultura';
      showToast('✨ La esencia de la vida despierta la escultura', 4800);
    }

    function updateArtifactAndAwakening(dt, timeSec) {
      if (!gyroGroup || !gyroModel || !gyroAimPivot) return;

      if (renderer.xr.isPresenting && artifactState === ARTIFACT_STATE.EXPLORACION) {
        for (let i = 0; i < controllers.length; i++) {
          const pointing = isControllerPointingAtGyro(controllers[i]);
          controllerLines[i].material.color.setHex(pointing ? 0xfde047 : 0xa3e635);
          controllerLines[i].material.opacity = pointing ? 0.92 : 0.45;
        }
      }

      if (artifactState === ARTIFACT_STATE.EXPLORACION) {
        gyroGroup.position.set(
          gyroRestPosition.x,
          gyroRestPosition.y + Math.sin(timeSec * 1.9) * 0.06,
          gyroRestPosition.z
        );
        gyroAimPivot.quaternion.identity();
        gyroModel.rotation.y += dt * 0.95;
        gyroModel.rotation.x = Math.sin(timeSec * 1.2) * 0.18;

        const pulse = 0.5 + 0.5 * Math.sin(timeSec * 2.4);
        gyroLight.intensity = 0.78 + pulse * 0.44;
        gyroLight.distance = 4.8;
        if (gyroHaloSprite) {
          gyroHaloSprite.material.opacity = 0.16 + pulse * 0.10;
          gyroHaloSprite.scale.setScalar(0.48 + pulse * 0.07);
        }
        for (const mat of gyroMaterials) {
          mat.emissive.copy(_goldColor);
          mat.emissiveIntensity = 0.15 + pulse * 0.12;
        }
        updateGyroTrail(dt, timeSec, gyroGroup.position, 0.036);
        return;
      }

      if (artifactState === ARTIFACT_STATE.PORTANDO) {
        if (carryingMode === 'xr' && carryingController) {
          carryingController.getWorldPosition(_tempVecA);
          _tempMatrix.identity().extractRotation(carryingController.matrixWorld);
          _tempVecB.set(0, 0.05, -0.22).applyMatrix4(_tempMatrix);
          _tempVecA.add(_tempVecB);
        } else {
          const activeCam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
          _tempVecA.set(0.24, -0.20, -0.74).applyMatrix4(activeCam.matrixWorld);
        }

        interiorGroup.worldToLocal(_tempVecA);

        // Comportamiento magnético: el objeto tira suavemente hacia la escultura y se orienta buscándola
        _magDir.subVectors(sculptureCenterLocal, _tempVecA);
        const rawDist = _magDir.length();
        const distMeters = sculptureLocalBox.distanceToPoint(gyroGroup.position);
        const proximity = THREE.MathUtils.clamp(1.0 - (distMeters - 0.65) / 8.0, 0.0, 1.0);

        if (rawDist > 0.001) {
          _magDir.divideScalar(rawDist);
          const pullMeters = Math.min(rawDist * 0.35, 0.14 + proximity * 0.26 + Math.sin(timeSec * 4.5) * 0.018);
          _tempVecA.addScaledVector(_magDir, pullMeters);
        }

        gyroGroup.position.lerp(_tempVecA, Math.min(1, dt * 8.5));

        // Orientación magnética hacia el centro de la escultura
        _aimMatrix.lookAt(sculptureCenterLocal, gyroGroup.position, _upVec);
        _targetQuat.setFromRotationMatrix(_aimMatrix);
        gyroAimPivot.quaternion.slerp(_targetQuat, Math.min(1, dt * 7.5));

        const spinSpeed = 1.6 + proximity * 6.5;
        gyroModel.rotation.z += dt * spinSpeed;
        gyroModel.rotation.y += dt * (0.45 + proximity * 1.4);

        const compassPulse = 0.5 + 0.5 * Math.sin(timeSec * (3.2 + proximity * 9.0));
        gyroLight.intensity = 0.85 + proximity * 0.62 + compassPulse * 0.22;
        gyroLight.distance = 5.0 + proximity * 1.8;
        if (gyroHaloSprite) {
          gyroHaloSprite.material.opacity = 0.16 + proximity * 0.12 + compassPulse * 0.06;
          gyroHaloSprite.scale.setScalar(0.50 + proximity * 0.10 + compassPulse * 0.04);
        }
        for (const mat of gyroMaterials) {
          mat.emissive.copy(_goldColor).lerp(_goldWarm, proximity * 0.35);
          mat.emissiveIntensity = 0.16 + proximity * 0.22 + compassPulse * 0.08;
        }

        if (carryingController && distMeters < 2.2 && (timeSec - lastHapticTime) > (0.45 - proximity * 0.25)) {
          lastHapticTime = timeSec;
          triggerHaptic(carryingController, 0.15 + proximity * 0.35, 40);
        }

        updateGyroTrail(dt, timeSec, gyroGroup.position, 0.016);

        if (distMeters <= 0.65) {
          activateSculptureAwakening();
        }
        return;
      }

      if (artifactState === ARTIFACT_STATE.ACTIVADO) {
        awakeningElapsed += dt;

        // Órbita elegante alrededor de la escultura (desplazada +X para no tocar la pared izquierda)
        orbitAngle += dt * 0.52;
        const orbitCenterX = sculptureCenterLocal.x + 0.18;
        const targetX = orbitCenterX + Math.cos(orbitAngle) * sculptureOrbitRadius;
        const targetZ = sculptureCenterLocal.z + Math.sin(orbitAngle) * sculptureOrbitRadius;
        const targetY = sculptureCenterLocal.y + 0.22 + Math.sin(timeSec * 1.35) * 0.14;

        _tempVecA.set(targetX, targetY, targetZ);
        gyroGroup.position.lerp(_tempVecA, Math.min(1, dt * 3.0));

        // Mantiene su orientación hacia la escultura mientras gira nítidamente
        _aimMatrix.lookAt(sculptureCenterLocal, gyroGroup.position, _upVec);
        _targetQuat.setFromRotationMatrix(_aimMatrix);
        gyroAimPivot.quaternion.slerp(_targetQuat, Math.min(1, dt * 4.5));

        gyroModel.rotation.z += dt * 2.2;
        gyroModel.rotation.y += dt * 0.95;

        // Estela conservada con brillo controlado para distinguir claramente el giroscopio y su movimiento
        updateGyroTrail(dt, timeSec, gyroGroup.position, 0.013);

        // Flujo de esencia luminosa del giroscopio hacia la escultura
        updateTransferStream(dt, timeSec, gyroGroup.position);

        // Brillo intermitente a modo de latido de corazón ("lub-dub ... pausa")
        const heartbeat = getHeartbeatPulse(timeSec, 64);
        gyroLight.intensity = 0.55 + heartbeat * 2.15;
        gyroLight.distance = 5.2 + heartbeat * 2.6;
        if (gyroHaloSprite) {
          gyroHaloSprite.material.opacity = 0.10 + heartbeat * 0.34;
          gyroHaloSprite.scale.setScalar(0.46 + heartbeat * 0.24);
        }
        for (const mat of gyroMaterials) {
          mat.emissive.copy(_goldColor).lerp(_goldPulse, heartbeat * 0.72);
          mat.emissiveIntensity = 0.12 + heartbeat * 0.62;
        }

        // La escultura NO brilla; queda cubierta y rodeada permanentemente por partículas luminosas mágicas
        // (tanto mientras habla como después de terminar de hablar)
        if (magicSandMat && magicSandPoints) {
          const isSpeaking = Boolean(
            (narrationTracks.awaken.audio && narrationTracks.awaken.audio.isPlaying) ||
            ('speechSynthesis' in window && window.speechSynthesis.speaking)
          );
          const sandRamp = THREE.MathUtils.smoothstep(awakeningElapsed, 0.35, 2.1);
          const gentleWave = 0.5 + 0.5 * Math.sin(timeSec * 1.8);
          const targetSpeakingBoost = isSpeaking ? 1.0 : 0.0;

          magicSandMat.uniforms.uSpeakingBoost.value = THREE.MathUtils.lerp(
            magicSandMat.uniforms.uSpeakingBoost.value,
            targetSpeakingBoost,
            Math.min(1, dt * 2.2)
          );
          magicSandMat.uniforms.uTime.value = timeSec;
          magicSandMat.uniforms.uIntensity.value = sandRamp * (0.90 + gentleWave * 0.10 + magicSandMat.uniforms.uSpeakingBoost.value * 0.08);
          magicSandPoints.visible = sandRamp > 0.005;
        }
      }
    }

    function triggerMaterializationWave() {
      renderer.localClippingEnabled = true;
      isMaterializing = true;
      materializationT = 0;
      clippingPlane.constant = hallAnchorGroup.position.y + 0.05;

      leafParticles.visible = true;
      leafMaterial.uniforms.uProgress.value = 0;
      leafMaterial.uniforms.uOpacity.value = 1.0;

      fireflies.visible = false;

      magicWaveRing.visible = true;
      magicWaveRing.material.opacity = 0.85;
      magicWaveLight.intensity = 4.5;
      showToast('✨ Materializando Pasillo y Escultura...');
    }

    function setupUIAndDesktopControls() {
      btnStartPreview.addEventListener('click', () => {
        unlockAudio();
        loadingModal.classList.add('hidden');
        hudOverlay.classList.add('active');
        triggerMaterializationWave();
      });
      btnReplayMagic.addEventListener('click', () => {
        unlockAudio();
        triggerMaterializationWave();
      });
      btnFullscreen.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFullscreen();
      });
      btnEnterVR.addEventListener('click', () => { unlockAudio(); startXRSession('immersive-vr'); });
      btnEnterAR.addEventListener('click', () => { unlockAudio(); startXRSession('immersive-ar'); });

      btnEnterARIos.addEventListener('click', () => {
        unlockAudio();
        showToast('En iOS, usa el modo 3D o instala WebXR. Abriendo vista 3D...');
        loadingModal.classList.add('hidden');
        hudOverlay.classList.add('active');
      });

      const bindWalkButton = (btn, dir) => {
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault(); unlockAudio(); btn.classList.add('pressing'); moveButtonDir = dir;
          advanceAlongViewDirection(dir * 1.6, 0);
        });
        const stopPress = () => { btn.classList.remove('pressing'); if (moveButtonDir === dir) moveButtonDir = 0; };
        btn.addEventListener('pointerup', stopPress); btn.addEventListener('pointerleave', stopPress); btn.addEventListener('pointercancel', stopPress);
      };
      bindWalkButton(btnStepForward, 1); bindWalkButton(btnStepBack, -1);
      btnResetWalk.addEventListener('click', () => { targetWalkOffset.set(0, 0, 0); showToast('Regresando a la entrada del pasillo'); });

      const viewport = document.getElementById('webgl-viewport');
      viewport.addEventListener('pointerdown', (e) => {
        unlockAudio();
        isPointerDown = true;
        pointerDownX = prevPointerX = e.clientX;
        pointerDownY = prevPointerY = e.clientY;
      });
      window.addEventListener('pointermove', (e) => {
        if (!isPointerDown || renderer.xr.isPresenting) return;
        const dx = e.clientX - prevPointerX; const dy = e.clientY - prevPointerY;
        prevPointerX = e.clientX; prevPointerY = e.clientY;
        yaw -= dx * 0.0045; pitch = THREE.MathUtils.clamp(pitch - dy * 0.0045, -1.1, 1.1);
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
      });
      window.addEventListener('pointerup', (e) => {
        if (isPointerDown && !renderer.xr.isPresenting) {
          const moved = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
          if (moved < 8) {
            tryGrabGyroWithPointer(e.clientX, e.clientY);
          }
        }
        isPointerDown = false;
      });

      window.addEventListener('keydown', (e) => {
        unlockAudio();
        const k = e.key.toLowerCase();
        if (k === 'w' || e.key === 'ArrowUp') keysPressed.forward = true;
        if (k === 's' || e.key === 'ArrowDown') keysPressed.back = true;
        if (k === 'a' || e.key === 'ArrowLeft') keysPressed.left = true;
        if (k === 'd' || e.key === 'ArrowRight') keysPressed.right = true;
        if (k === 'f') toggleFullscreen();
      });
      window.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'w' || e.key === 'ArrowUp') keysPressed.forward = false;
        if (k === 's' || e.key === 'ArrowDown') keysPressed.back = false;
        if (k === 'a' || e.key === 'ArrowLeft') keysPressed.left = false;
        if (k === 'd' || e.key === 'ArrowRight') keysPressed.right = false;
      });
    }

    function detectARSupport() {
      if (navigator.xr && navigator.xr.isSessionSupported) {
        navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
          if (!supported) {
            btnEnterAR.classList.add('hidden');
            btnEnterARIos.classList.remove('hidden');
          }
        }).catch(() => {
          btnEnterAR.classList.add('hidden');
          btnEnterARIos.classList.remove('hidden');
        });
      } else {
        btnEnterAR.classList.add('hidden');
        btnEnterARIos.classList.remove('hidden');
      }
    }

    function advanceAlongViewDirection(forwardMeters, strafeMeters = 0) {
      const activeCam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
      activeCam.getWorldDirection(_rayDir);
      _horizDir.set(_rayDir.x, 0, _rayDir.z);
      if (_horizDir.lengthSq() < 0.001) _horizDir.set(0, 0, -1); else _horizDir.normalize();
      _invAnchorQuat.copy(hallAnchorGroup.quaternion).invert();
      _localForward.copy(_horizDir).applyQuaternion(_invAnchorQuat); _localForward.y = 0; _localForward.normalize();
      _localRight.set(-_localForward.z, 0, _localForward.x);
      targetWalkOffset.x -= (_localForward.x * forwardMeters + _localRight.x * strafeMeters);
      targetWalkOffset.z -= (_localForward.z * forwardMeters + _localRight.z * strafeMeters);
      targetWalkOffset.x = THREE.MathUtils.clamp(targetWalkOffset.x, -1.45, 1.45);
      targetWalkOffset.z = THREE.MathUtils.clamp(targetWalkOffset.z, -10.0, totalCorridorLength + 25.0);
    }

    function processQuestThumbsticks(dt) {
      if (!renderer.xr.isPresenting) return;
      const session = renderer.xr.getSession();
      if (!session || !session.inputSources) return;
      if (buttonCooldown > 0) buttonCooldown -= dt;
      for (const source of session.inputSources) {
        if (!source.gamepad) continue;
        const gp = source.gamepad; const axes = gp.axes;
        const stickX = axes.length >= 4 ? axes[2] : (axes[0] || 0);
        const stickY = axes.length >= 4 ? axes[3] : (axes[1] || 0);
        if (Math.abs(stickY) > 0.15 || Math.abs(stickX) > 0.15) {
          if (source.handedness === 'left' || session.inputSources.length === 1) {
            advanceAlongViewDirection(-stickY * 3.8 * dt, stickX * 2.5 * dt);
          } else if (source.handedness === 'right') {
            advanceAlongViewDirection(-stickY * 3.8 * dt, 0);
            if (Math.abs(stickX) > 0.25) hallAnchorGroup.rotation.y -= stickX * 1.4 * dt;
          }
        }
        if (gp.buttons[4]?.pressed && buttonCooldown <= 0) { buttonCooldown = 0.45; targetWalkOffset.set(0, 0, 0); }
        if (gp.buttons[5]?.pressed && buttonCooldown <= 0) { buttonCooldown = 0.45; triggerMaterializationWave(); }
      }
    }

    async function startXRSession(requestedMode = 'immersive-vr') {
      loadingModal.classList.add('hidden');
      hudOverlay.classList.add('active');
      if (!navigator.xr) { showToast('WebXR no detectado en este navegador · Modo 3D activo'); return; }
      try {
        let mode = requestedMode; let supported = await navigator.xr.isSessionSupported(mode);
        if (!supported) {
          const fallback = mode === 'immersive-vr' ? 'immersive-ar' : 'immersive-vr';
          if (await navigator.xr.isSessionSupported(fallback)) { mode = fallback; supported = true; }
        }
        if (!supported) { showToast('Visor XR no conectado · Explorando en pantalla 3D'); return; }
        const session = await navigator.xr.requestSession(mode, {
          optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'dom-overlay'],
          domOverlay: { root: hudOverlay }
        });
        try { renderer.xr.setReferenceSpaceType('local-floor'); } catch (_) { renderer.xr.setReferenceSpaceType('local'); }
        await renderer.xr.setSession(session);
        if (mode === 'immersive-ar' || session.environmentBlendMode === 'alpha-blend') {
          scene.background = null; scene.fog = null;
        } else {
          scene.background = new THREE.Color(0x050a08); scene.fog = new THREE.FogExp2(0x050a08, 0.018);
        }
        hallAnchorGroup.position.set(0, 0, 0); hallAnchorGroup.visible = true;
        targetWalkOffset.set(0, 0, 0); currentWalkOffset.set(0, 0, 0);
        if (artifactState === ARTIFACT_STATE.EXPLORACION) {
          hasTriggeredMidCorridor = false;
        }
        triggerMaterializationWave();
        session.addEventListener('end', () => {
          scene.background = new THREE.Color(0x050a08); scene.fog = new THREE.FogExp2(0x050a08, 0.018);
        });
      } catch (err) {
        console.warn('No se pudo abrir sesión XR:', err);
        showToast('Modo 3D activo en navegador');
      }
    }

    function renderLoop(timestamp) {
      const dt = Math.min(0.05, (timestamp - lastFrameTime) / 1000 || 0.016);
      lastFrameTime = timestamp;
      const timeSec = timestamp * 0.001;
      processQuestThumbsticks(dt);
      if (moveButtonDir !== 0) advanceAlongViewDirection(moveButtonDir * 4.4 * dt, 0);
      if (keysPressed.forward) advanceAlongViewDirection(4.2 * dt, 0);
      if (keysPressed.back) advanceAlongViewDirection(-4.2 * dt, 0);
      if (keysPressed.left) advanceAlongViewDirection(0, -3.2 * dt);
      if (keysPressed.right) advanceAlongViewDirection(0, 3.2 * dt);
      currentWalkOffset.lerp(targetWalkOffset, Math.min(1, dt * 8.5));
      walkStageGroup.position.set(currentWalkOffset.x, 0, currentWalkOffset.z);
      distanceReadout.textContent = `${currentWalkOffset.z.toFixed(1)} m`;

      if (isMaterializing) {
        materializationT = Math.min(1, materializationT + dt * 0.28);
        const eased = 1 - Math.pow(1 - materializationT, 3);
        const revealH = eased * maxRevealHeight;
        clippingPlane.constant = hallAnchorGroup.position.y + revealH;
        leafMaterial.uniforms.uTime.value = timeSec;
        leafMaterial.uniforms.uProgress.value = eased;
        leafMaterial.uniforms.uOpacity.value = 1.0;
        magicWaveRing.position.y = Math.min(revealH, 6.0);
        magicWaveRing.rotation.z = timeSec * 1.8;
        magicWaveRing.scale.setScalar(1.0 + Math.sin(timeSec * 5.0) * 0.12);
        magicWaveRing.material.opacity = (1.0 - materializationT) * 0.85;
        magicWaveLight.position.set(0, Math.min(revealH + 0.5, 6.5), -(totalCorridorLength * 0.42));
        magicWaveLight.intensity = (1.0 - materializationT * 0.7) * 5.0;

        if (materializationT >= 1) {
          isMaterializing = false;
          renderer.localClippingEnabled = false;
          clippingPlane.constant = 1000;
          magicWaveRing.visible = false;
          magicWaveLight.intensity = 0;

          leafParticles.visible = false;
          fireflies.visible = true;

          if (artifactState === ARTIFACT_STATE.EXPLORACION && !hasTriggeredMidCorridor) {
            statusText.textContent = 'Pasillo materializado · Avanza y busca el objeto mágico';
          }
        }
      } else if (leafParticles && leafParticles.visible) {
        leafMaterial.uniforms.uTime.value = timeSec * 0.65;
        leafMaterial.uniforms.uOpacity.value = Math.max(0.45, leafMaterial.uniforms.uOpacity.value - dt * 0.25);
      }

      if (fireflies && fireflies.visible) {
        fireflyMaterial.uniforms.uTime.value = timeSec;
      }

      checkMidCorridorIntroTrigger();
      updateArtifactAndAwakening(dt, timeSec);

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
