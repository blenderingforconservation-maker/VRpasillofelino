<!DOCTYPE html>
<html lang="es">

  <!-- Importmap Oficial Three.js r160 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100dvh; min-height: -webkit-fill-available;
      overflow: hidden; background-color: #050a08; font-family: 'Inter', sans-serif; touch-action: none;
    }
    .font-museum { font-family: 'Cormorant Garamond', Georgia, serif; }
    #webgl-viewport { position: fixed; inset: 0; z-index: 2; cursor: grab; }
    #webgl-viewport:active { cursor: grabbing; }
    #hud-overlay {
      position: fixed; inset: 0; z-index: 10; pointer-events: none; display: none;
      flex-direction: column; justify-content: space-between;
      padding: max(env(safe-area-inset-top, 14px), 12px) max(env(safe-area-inset-right, 16px), 14px) max(env(safe-area-inset-bottom, 18px), 14px) max(env(safe-area-inset-left, 16px), 14px);
    }
    #hud-overlay.active { display: flex; }
    .interactive { pointer-events: auto; }
    .magic-btn {
      background: radial-gradient(circle at 50% 0%, rgba(163, 230, 53, 0.28), rgba(6, 28, 20, 0.90) 75%);
      border: 1px solid rgba(190, 242, 100, 0.45);
      box-shadow: 0 0 20px rgba(132, 204, 22, 0.25), inset 0 1px 1px rgba(254, 240, 138, 0.35);
      transition: transform 0.12s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .magic-btn:active, .magic-btn.pressing {
      transform: scale(0.94); border-color: rgba(253, 224, 71, 0.95);
      box-shadow: 0 0 28px rgba(250, 204, 21, 0.55), inset 0 0 12px rgba(163, 230, 53, 0.45);
    }
    .magic-cta {
      background: linear-gradient(135deg, #22c55e 0%, #a3e635 50%, #facc15 100%);
      box-shadow: 0 0 30px rgba(163, 230, 53, 0.55), 0 0 60px rgba(250, 204, 21, 0.25);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }
    .magic-cta:active { transform: scale(0.95); }
    #toast-banner {
      position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
      padding: 8px 20px; background: rgba(5, 14, 10, 0.92); border: 1px solid rgba(163, 230, 53, 0.45);
      border-radius: 999px; color: #ecfccb; font-size: 12px; font-weight: 500; letter-spacing: 0.03em;
      opacity: 0; transition: opacity 0.25s ease; pointer-events: none; text-align: center;
      max-width: 90vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 30;
    }

    /* Modo Pantalla Completa inmersivo (también habilita vista limpia total en iPhone / iOS Safari) */
    body.immersive-fullscreen #status-pill,
    body.immersive-fullscreen #xr-launch-bar,
    body.immersive-fullscreen #btn-replay-magic {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
    }
    #status-pill, #xr-launch-bar, #btn-replay-magic {
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    body.immersive-fullscreen #btn-fullscreen {
      border-color: rgba(253, 224, 71, 0.85);
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.35);
    }
  </style>
</head>
<body>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    const REPO_RAW_BASE = './';
    const MODELS = {
      corridor: `${REPO_RAW_BASE}models/pasillo_optimizado.glb`,
      sculpture: `${REPO_RAW_BASE}models/escultura_felina_webAR_optimizado.glb`,
      gyroscope: `${REPO_RAW_BASE}models/goldengirosc_optimizado.glb`
    };

    // Carpeta audios/ del repositorio
    const AUDIO_FILES = {
      intro: `${REPO_RAW_BASE}audios/intro.mp3`,
      pickup: `${REPO_RAW_BASE}audios/objeto-magico.mp3`,
      awaken: `${REPO_RAW_BASE}audios/audio_escultura.mp3`
    };

    // Respaldo hablado en caso de fallo de red
    const FALLBACK_TEXTS = {
      intro: 'El arte es una magia que hace que las horas se desvanezcan e incluso los días se disuelvan en segundos.',
      pickup: 'Uno debe tener mucho cuidado con lo que se lleva cuando se marcha para siempre; algo aparentemente inútil puede volverse esencial bajo circunstancias específicas.',
      awaken: 'Si hay dioses, no los creo con forma humana, prefiero pensar a los dioses en forma de cebras, gatos, pájaros. Puede que no creas en la magia, pero algo muy extraño está sucediendo en este preciso momento.'
    };

    const ARTIFACT_STATE = {
      EXPLORACION: 0,
      PORTANDO: 1,
      ACTIVADO: 2
    };

    let scene, camera, renderer, gltfLoader;
    let hallAnchorGroup, walkStageGroup, interiorGroup;
    let clippingPlane, leafParticles, leafMaterial, magicWaveRing, magicWaveLight;
    let fireflies, fireflyMaterial;

    // Entidades de la escultura y el giroscopio
    let sculptureGroup = null;
    let sculptureLocalBox = new THREE.Box3();
    let sculptureCenterLocal = new THREE.Vector3();
    let sculptureSizeLocal = new THREE.Vector3();
    let sculptureOrbitRadius = 0.78;
    let sculptureLight = null;

    let gyroGroup = null;
    let gyroAimPivot = null;
    let gyroModel = null;
    let gyroHitSphere = null;
    let gyroLight = null;
    let gyroHaloSprite = null;
    let gyroRestPosition = new THREE.Vector3();
    const gyroMaterials = [];

    // Flujo de partículas de transferencia (esencia de la vida: objeto -> escultura)
    const TRANSFER_COUNT = 340;
    let transferPoints = null;
    let transferPositions = null;
    let transferProgress = null;
    let transferSpeeds = null;
    let transferSizes = null;
    let transferOffsets = null;
    let transferTargets = null;
    let transferStreamActive = false;
    let transferStreamFade = 0;

    // Cobertura permanente de partículas luminosas sobre y alrededor de la escultura (1 solo draw call)
    let magicSandPoints = null;
    let magicSandMat = null;

    // Estela de partículas del objeto mágico al flotar (brillo moderado para distinguir el objeto)
    const TRAIL_COUNT = 380;
    let trailPoints = null;
    let trailPositions = null;
    let trailLives = null;
    let trailMaxLives = null;
    let trailSizes = null;
    let trailPhases = null;
    let trailCursor = 0;
    let trailSpawnAccum = 0;

    // Estado narrativo y control de audio a medio pasillo
    let artifactState = ARTIFACT_STATE.EXPLORACION;
    let carryingMode = null; // 'xr' | 'camera' | null
    let carryingController = null;
    let orbitAngle = 0;
    let awakeningElapsed = 0;
    let lastHapticTime = 0;

    let hasTriggeredMidCorridor = false;

    // Estado de pantalla completa (PC, Android y fallback inmersivo iPhone/iOS)
    let isPseudoFullscreen = false;

    const controllers = [];
    const controllerLines = [];
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();

    let isMaterializing = false;
    let materializationT = 0;
    let maxRevealHeight = 10.8;
    let totalCorridorLength = 14.0;
    let lastFrameTime = performance.now();

    const targetWalkOffset = new THREE.Vector3(0, 0, 0);
    const currentWalkOffset = new THREE.Vector3(0, 0, 0);
    let moveButtonDir = 0;
    let buttonCooldown = 0;
    const keysPressed = { forward: false, back: false, left: false, right: false };

    let isPointerDown = false;
    let pointerDownX = 0;
    let pointerDownY = 0;
    let prevPointerX = 0;
    let prevPointerY = 0;
    let yaw = 0;
    let pitch = 0;

    // Vectores, matrices y cuaterniones reutilizables (cero GC en renderLoop)
    const _rayDir = new THREE.Vector3();
    const _horizDir = new THREE.Vector3();
    const _localForward = new THREE.Vector3();
    const _localRight = new THREE.Vector3();
    const _invAnchorQuat = new THREE.Quaternion();
    const _tempMatrix = new THREE.Matrix4();
    const _aimMatrix = new THREE.Matrix4();
    const _targetQuat = new THREE.Quaternion();
    const _upVec = new THREE.Vector3(0, 1, 0);
    const _tempVecA = new THREE.Vector3();
    const _tempVecB = new THREE.Vector3();
    const _magDir = new THREE.Vector3();
    const _camLocalPos = new THREE.Vector3();
    const _midCtrl = new THREE.Vector3();
    const _goldColor = new THREE.Color(0xfbbf24);
    const _goldWarm = new THREE.Color(0xfde68a);
    const _goldPulse = new THREE.Color(0xfff4bd);

    // Motor de audio de 3 pistas con crossfade anti-empalme
    let audioCtx = null;
    let audioListener = null;
    const narrationTracks = {
      intro: { audio: null, loaded: false, volume: 0.94 },
      pickup: { audio: null, loaded: false, volume: 0.94 },
      awaken: { audio: null, loaded: false, volume: 0.98 }
    };
    let activeTrackKey = null;

    const hudOverlay = document.getElementById('hud-overlay');
    const loadingModal = document.getElementById('loading-modal');
    const launchControls = document.getElementById('launch-controls');
    const btnStartPreview = document.getElementById('btn-start-preview');
    const btnEnterVR = document.getElementById('btn-enter-vr');
    const btnEnterAR = document.getElementById('btn-enter-ar');
    const btnEnterARIos = document.getElementById('btn-enter-ar-ios');
    const btnReplayMagic = document.getElementById('btn-replay-magic');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const iconFsEnter = document.getElementById('icon-fs-enter');
    const iconFsExit = document.getElementById('icon-fs-exit');
    const labelFullscreen = document.getElementById('label-fullscreen');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    const btnStepForward = document.getElementById('btn-step-forward');
    const btnStepBack = document.getElementById('btn-step-back');
    const btnResetWalk = document.getElementById('btn-reset-walk');
    const distanceReadout = document.getElementById('distance-readout');
    const toastBanner = document.getElementById('toast-banner');

    function showToast(msg, duration = 3600) {
      toastBanner.textContent = msg;
      toastBanner.style.opacity = '1';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { toastBanner.style.opacity = '0'; }, duration);
    }

    // Curva orgánica de latido de corazón (doble pulso "lub-dub" + pausa en reposo)
    function getHeartbeatPulse(timeSec, bpm = 64) {
      const period = 60 / bpm;
      const p = (timeSec % period) / period;
      const lub = Math.exp(-Math.pow((p - 0.12) / 0.048, 2));
      const dub = 0.72 * Math.exp(-Math.pow((p - 0.29) / 0.055, 2));
      return Math.min(1.0, lub + dub);
    }

    // --- PANTALLA COMPLETA MULTIPLATAFORMA (PC, ANDROID E IPHONE/IOS) ---
    function getNativeFullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
    }

    function supportsNativeFullscreen() {
      const el = document.documentElement;
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) return false;
      return Boolean(
        (document.fullscreenEnabled || document.webkitFullscreenEnabled || document.msFullscreenEnabled) &&
        (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)
      );
    }

    function syncViewportSize() {
      if (!renderer || renderer.xr.isPresenting) return;
      const w = window.visualViewport ? Math.round(window.visualViewport.width) : window.innerWidth;
      const h = window.visualViewport ? Math.round(window.visualViewport.height) : window.innerHeight;
      camera.aspect = w / Math.max(1, h);
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function updateFullscreenUI() {
      const active = Boolean(getNativeFullscreenElement()) || isPseudoFullscreen;
      document.body.classList.toggle('immersive-fullscreen', active);
      iconFsEnter.classList.toggle('hidden', active);
      iconFsExit.classList.toggle('hidden', !active);
      labelFullscreen.textContent = active ? 'Salir' : 'Pantalla Completa';
      btnFullscreen.title = active ? 'Salir de pantalla completa' : 'Pantalla completa';
      btnFullscreen.setAttribute('aria-label', active ? 'Salir de pantalla completa' : 'Pantalla completa');
      syncViewportSize();
    }

    async function toggleFullscreen() {
      unlockAudio();
      const nativeEl = getNativeFullscreenElement();

      if (nativeEl) {
        try {
          if (document.exitFullscreen) await document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          else if (document.msExitFullscreen) document.msExitFullscreen();
        } catch (_) {}
        isPseudoFullscreen = false;
        updateFullscreenUI();
        return;
      }

      if (isPseudoFullscreen) {
        isPseudoFullscreen = false;
        updateFullscreenUI();
        return;
      }

      if (supportsNativeFullscreen()) {
        const target = document.documentElement;
        try {
          if (target.requestFullscreen) {
            await target.requestFullscreen({ navigationUI: 'hide' }).catch(() => target.requestFullscreen());
          } else if (target.webkitRequestFullscreen) {
            target.webkitRequestFullscreen();
          } else if (target.msRequestFullscreen) {
            target.msRequestFullscreen();
          }
          setTimeout(updateFullscreenUI, 80);
          return;
        } catch (err) {
          console.warn('Fallback a modo pantalla completa inmersivo:', err);
        }
      }

      isPseudoFullscreen = true;
      updateFullscreenUI();
      window.scrollTo(0, 1);
      setTimeout(() => { window.scrollTo(0, 1); syncViewportSize(); }, 180);
      showToast('Vista inmersiva activa · Toca el botón superior para salir');
    }

    // --- SISTEMA DE 3 AUDIOS DEL REPOSITORIO CON CROSSFADE ANTI-EMPALME ---
    function unlockAudio() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx && AudioContextClass) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      if (audioListener && audioListener.context && audioListener.context.state === 'suspended') {
        audioListener.context.resume().catch(() => {});
      }
    }

    function setupAudioSystem() {
      audioListener = new THREE.AudioListener();
      camera.add(audioListener);

      narrationTracks.intro.audio = new THREE.Audio(audioListener);
      narrationTracks.pickup.audio = new THREE.Audio(audioListener);

      const posAudio = new THREE.PositionalAudio(audioListener);
      posAudio.setRefDistance(2.8);
      posAudio.setMaxDistance(20.0);
      posAudio.setRolloffFactor(0.95);
      narrationTracks.awaken.audio = posAudio;

      const loader = new THREE.AudioLoader();
      Object.keys(AUDIO_FILES).forEach((key) => {
        loader.load(
          AUDIO_FILES[key],
          (buffer) => {
            narrationTracks[key].audio.setBuffer(buffer);
            narrationTracks[key].audio.setVolume(narrationTracks[key].volume);
            narrationTracks[key].loaded = true;
          },
          undefined,
          (err) => {
            console.warn(`No se pudo cargar ${AUDIO_FILES[key]}:`, err);
            narrationTracks[key].loaded = false;
          }
        );
      });
    }

    function fadeOutCurrentNarration(fadeSec = 0.35) {
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (_) {}
      }
      if (!activeTrackKey) return;
      const prev = narrationTracks[activeTrackKey];
      activeTrackKey = null;
      if (!prev || !prev.audio || !prev.audio.isPlaying) return;

      const audioObj = prev.audio;
      const ctx = audioListener?.context;
      if (ctx && audioObj.gain && audioObj.gain.gain) {
        const now = ctx.currentTime;
        const g = audioObj.gain.gain;
        g.cancelScheduledValues(now);
        g.setValueAtTime(Math.max(0.0001, g.value), now);
        g.exponentialRampToValueAtTime(0.0001, now + fadeSec);
        setTimeout(() => {
          if (audioObj.isPlaying) audioObj.stop();
          g.cancelScheduledValues(ctx.currentTime);
          g.setValueAtTime(prev.volume, ctx.currentTime);
        }, Math.round(fadeSec * 1000) + 30);
      } else {
        audioObj.stop();
      }
    }

    function playNarrativeTrack(key) {
      unlockAudio();
      const hadActive = Boolean(activeTrackKey);
      fadeOutCurrentNarration(0.35);

      const startDelayMs = hadActive ? 360 : 0;
      const track = narrationTracks[key];

      setTimeout(() => {
        activeTrackKey = key;
        if (track && track.loaded && track.audio && track.audio.buffer) {
          const ctx = audioListener?.context;
          if (ctx && track.audio.gain && track.audio.gain.gain) {
            const now = ctx.currentTime;
            track.audio.gain.gain.cancelScheduledValues(now);
            track.audio.gain.gain.setValueAtTime(0.001, now);
            track.audio.gain.gain.linearRampToValueAtTime(track.volume, now + 0.12);
          } else {
            track.audio.setVolume(track.volume);
          }
          if (track.audio.isPlaying) track.audio.stop();
          track.audio.play();
          return;
        }

        if ('speechSynthesis' in window && FALLBACK_TEXTS[key]) {
          try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(FALLBACK_TEXTS[key]);
            utterance.lang = 'es-MX';
            utterance.rate = 0.89;
            utterance.pitch = 0.96;
            const voices = window.speechSynthesis.getVoices();
            const preferred = voices.find((v) => v.lang.startsWith('es') && /paulina|monica|helena|sabina|google/i.test(v.name))
              || voices.find((v) => v.lang.startsWith('es'));
            if (preferred) utterance.voice = preferred;
            window.speechSynthesis.speak(utterance);
          } catch (err) {
            console.warn('Narración fallback no disponible:', err);
          }
        }
      }, startDelayMs);
    }

    function playPickupChime() {
      unlockAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const notes = [587.33, 739.99, 880.0, 1174.66];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.06);
        gain.gain.setValueAtTime(0.0001, now + idx * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.055, now + idx * 0.06 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.06 + 0.72);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.06);
        osc.stop(now + idx * 0.06 + 0.78);
      });
    }

    function playAwakeningChord() {
      unlockAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const freqs = [146.83, 220.0, 293.66, 369.99, 554.37, 659.25];
      freqs.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = i < 2 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(i < 2 ? 0.04 : 0.028, now + 0.85);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 5.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 5.4);
      });
    }

      if (actuator && typeof actuator.pulse === 'function') {

    function setupQuestControllers() {
      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -4.5)
      ]);
      for (let i = 0; i < 2; i++) {
        const controller = renderer.xr.getController(i);
        const lineMat = new THREE.LineBasicMaterial({ color: 0xa3e635, transparent: true, opacity: 0.45 });
        const line = new THREE.Line(lineGeo, lineMat);
        controller.add(line);

        const handleGrabAttempt = () => {
          unlockAudio();
          if (artifactState === ARTIFACT_STATE.EXPLORACION && !isMaterializing) {
            if (tryGrabGyroWithController(controller)) return true;
          }
          return false;
        };

        controller.addEventListener('selectstart', () => {
          const grabbed = handleGrabAttempt();
          if (!grabbed && artifactState === ARTIFACT_STATE.EXPLORACION) {
            if (!isControllerPointingAtGyro(controller)) {
              triggerMaterializationWave();
            }
          }
        });
        controller.addEventListener('squeezestart', handleGrabAttempt);

        scene.add(controller);
        controllers.push(controller);
        controllerLines.push(line);
      }
    }

    function isControllerPointingAtGyro(controller) {
      if (!gyroHitSphere || artifactState !== ARTIFACT_STATE.EXPLORACION) return false;
      _tempMatrix.identity().extractRotation(controller.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(_tempMatrix);
      raycaster.far = 9.0;
      return raycaster.intersectObject(gyroHitSphere, false).length > 0;
    }

    function onGyroPickedUp(mode, controller = null) {
      artifactState = ARTIFACT_STATE.PORTANDO;
      carryingMode = mode;
      carryingController = controller;
      hasTriggeredMidCorridor = true;

      playPickupChime();
      playNarrativeTrack('pickup');
      if (controller) triggerHaptic(controller, 0.65, 130);

      statusDot.className = 'w-2.5 h-2.5 rounded-full bg-yellow-300 animate-ping';
      statusText.textContent = 'Objeto mágico tomado · Sigue su atracción hacia la escultura';
      showToast('✨ El objeto mágico señala hacia la escultura...');
    }

    function tryGrabGyroWithController(controller) {
      if (!gyroGroup || !gyroHitSphere || artifactState !== ARTIFACT_STATE.EXPLORACION) return false;

      controller.getWorldPosition(_tempVecA);
      gyroGroup.getWorldPosition(_tempVecB);
      const directReach = _tempVecA.distanceTo(_tempVecB) <= 0.78;
      const rayHit = isControllerPointingAtGyro(controller);

      if (directReach || rayHit) {
        onGyroPickedUp('xr', controller);
        return true;
      }
      return false;
    }

    function tryGrabGyroWithPointer(clientX, clientY) {
      if (!gyroHitSphere || artifactState !== ARTIFACT_STATE.EXPLORACION || isMaterializing) return false;
      pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
      pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);
      raycaster.far = 22.0;
      if (raycaster.intersectObject(gyroHitSphere, false).length > 0) {
        unlockAudio();
        onGyroPickedUp('camera', null);
        return true;
      }
      return false;
    }

    function createRadiantLeafTexture() {

      ctx.beginPath(); ctx.moveTo(0, -48); ctx.bezierCurveTo(35, -30, 42, 14, 0, 46); ctx.bezierCurveTo(-42, 14, -35, -30, 0, -48); ctx.closePath();
      const leafGrad = ctx.createLinearGradient(0, -48, 0, 46);
      leafGrad.addColorStop(0, '#ffffff'); leafGrad.addColorStop(0.5, '#f7fee7'); leafGrad.addColorStop(1, '#d9f99d');
      ctx.fillStyle = leafGrad; ctx.fill();
      ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, -42); ctx.lineTo(0, 50); ctx.stroke();

      const colors = new Float32Array(leafCount * 3);

        const angle = Math.random() * Math.PI * 2; const radius = 0.4 + Math.random() * 2.1;

        const c = palette[Math.floor(Math.random() * palette.length)]; colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
        seeds[i * 4] = Math.random() * Math.PI * 2; seeds[i * 4 + 1] = 0.55 + Math.random() * 1.05; seeds[i * 4 + 2] = (Math.random() - 0.5) * 4.8; seeds[i * 4 + 3] = Math.random() < 0.28 ? 1.0 : 0.0;

        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,

        vertexShader: `
          attribute vec3 aColor; attribute vec4 aSeed;
          varying vec3 vColor; varying float vAngle; varying float vAlpha; varying float vSparkle; varying float vWaveGlow;
          uniform float uTime; uniform float uProgress; uniform float uMaxHeight; uniform float uPixelRatio;
          void main() {
            vColor = aColor; float phase = aSeed.x; float leafScale = aSeed.y; float rotSpeed = aSeed.z; vSparkle = aSeed.w;

            pos.z += sin(uTime * 5.0 + phase) * 0.15;
            float distToWave = abs(pos.y - bandY); float waveBoost = smoothstep(2.2, 0.0, distToWave); vWaveGlow = waveBoost;
            float twinkle = 0.65 + 0.35 * sin(uTime * 6.5 + phase * 3.0); vAngle = phase + uTime * rotSpeed;

        fragmentShader: `
          uniform sampler2D uMap; uniform float uOpacity;
          varying vec3 vColor; varying float vAngle; varying float vAlpha; varying float vSparkle; varying float vWaveGlow;

      magicWaveRing = new THREE.Mesh(ringGeo, ringMat); magicWaveRing.visible = false; magicWaveRing.frustumCulled = false; walkStageGroup.add(magicWaveRing);

    function setupFireflies() {
      // Incremento balanceado (400 luciérnagas en 1 solo draw call GPU)
      const fireflyCount = 400;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(fireflyCount * 3);
      const seeds = new Float32Array(fireflyCount);
      const traits = new Float32Array(fireflyCount * 4);
      const colors = new Float32Array(fireflyCount * 3);

      const fireflyPalette = [
        new THREE.Color('#efff9b'),
        new THREE.Color('#f8f59a'),
        new THREE.Color('#fff0a8'),
        new THREE.Color('#ffdf78'),
        new THREE.Color('#e8f58b')
      ];

      for (let i = 0; i < fireflyCount; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 4.2;
        positions[i * 3 + 1] = 0.35 + Math.random() * 5.0;
        positions[i * 3 + 2] = -Math.random() * 14.5;
        seeds[i] = Math.random() * 100.0;
        traits[i * 4] = Math.random();
        traits[i * 4 + 1] = 2.6 + Math.random() * 3.6;
        traits[i * 4 + 2] = 0.095 + Math.random() * 0.105;
        traits[i * 4 + 3] = 18.0 + Math.random() * 11.0;
        const color = fireflyPalette[Math.floor(Math.random() * fireflyPalette.length)];
        colors[i * 3] = color.r; colors[i * 3 + 1] = color.g; colors[i * 3 + 2] = color.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
      geo.setAttribute('aTraits', new THREE.BufferAttribute(traits, 4));
      geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));

      fireflyMaterial = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
        uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() }, uOpacity: { value: 0.88 } },
        vertexShader: `
          attribute float aSeed; attribute vec4 aTraits; attribute vec3 aColor;
          uniform float uTime; uniform float uPixelRatio;
          varying float vPulse; varying vec3 vColor;
          void main() {
            vec3 pos = position; float seed = aSeed;
            pos.x += sin(uTime * 0.48 + seed * 0.73) * 0.24 + cos(uTime * 0.19 + seed * 1.31) * 0.10;
            pos.y += sin(uTime * 0.62 + seed * 0.47) * 0.17 + cos(uTime * 0.27 + seed * 1.70) * 0.08;
            pos.z += cos(uTime * 0.38 + seed * 0.91) * 0.18;
            float phase = fract(uTime / aTraits.y + aTraits.x);
            float flash = 0.0;
            if (phase < aTraits.z) {
              float pulseT = phase / max(aTraits.z, 0.001);
              flash = smoothstep(0.0, 0.12, pulseT) * (1.0 - smoothstep(0.30, 1.0, pulseT));
            }
            float idleGlow = 0.022 + 0.014 * (0.5 + 0.5 * sin(uTime * 1.7 + seed * 2.4));
            float microFlicker = 0.96 + 0.04 * sin(uTime * 8.0 + seed * 3.7);
            vPulse = clamp((idleGlow + flash * 0.98) * microFlicker, 0.0, 1.0);
            vColor = aColor;
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            float apparentSize = aTraits.w * (0.78 + vPulse * 0.34);
            gl_PointSize = clamp((apparentSize * uPixelRatio) / max(-mvPosition.z, 0.70), 1.5, 24.0);
          }
        `,
        fragmentShader: `
          uniform float uOpacity;
          varying float vPulse; varying vec3 vColor;
          void main() {
            vec2 p = (gl_PointCoord - vec2(0.5)) * 2.0; float dist = length(p);
