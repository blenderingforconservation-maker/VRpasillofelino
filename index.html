  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden; background-color: #050a08; font-family: 'Inter', sans-serif; touch-action: none; }
    .font-museum { font-family: 'Cormorant Garamond', Georgia, serif; }
    #webgl-viewport { position: fixed; inset: 0; z-index: 2; cursor: grab; }
    #webgl-viewport:active { cursor: grabbing; }
    #hud-overlay { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: none; flex-direction: column; justify-content: space-between; padding: env(safe-area-inset-top, 14px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 18px) env(safe-area-inset-left, 16px); }
    #hud-overlay.active { display: flex; }
    .interactive { pointer-events: auto; }
    .magic-btn { background: radial-gradient(circle at 50% 0%, rgba(163, 230, 53, 0.28), rgba(6, 28, 20, 0.90) 75%); border: 1px solid rgba(190, 242, 100, 0.45); box-shadow: 0 0 20px rgba(132, 204, 22, 0.25), inset 0 1px 1px rgba(254, 240, 138, 0.35); transition: transform 0.12s ease, border-color 0.2s ease, box-shadow 0.2s ease; }
    .magic-btn:active, .magic-btn.pressing { transform: scale(0.94); border-color: rgba(253, 224, 71, 0.95); box-shadow: 0 0 28px rgba(250, 204, 21, 0.55), inset 0 0 12px rgba(163, 230, 53, 0.45); }
    .magic-cta { background: linear-gradient(135deg, #22c55e 0%, #a3e635 50%, #facc15 100%); box-shadow: 0 0 30px rgba(163, 230, 53, 0.55), 0 0 60px rgba(250, 204, 21, 0.25); transition: transform 0.15s ease, box-shadow 0.2s ease; }
    .magic-cta:active { transform: scale(0.95); }
    #toast-banner { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); padding: 8px 20px; background: rgba(5, 14, 10, 0.92); border: 1px solid rgba(163, 230, 53, 0.45); border-radius: 999px; color: #ecfccb; font-size: 12px; font-weight: 500; letter-spacing: 0.03em; opacity: 0; transition: opacity 0.25s ease; pointer-events: none; text-align: center; max-width: 90vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 30; }
  </style>
</head>
<body>

  <!-- Lienzo 3D Three.js -->
  <div id="webgl-viewport"></div>

  <!-- Notificación flotante -->
  <div id="toast-banner">Cargando sala inmersiva...</div>

  <!-- PANTALLA DE CARGA -->
  <div id="loading-modal" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-stone-950/95 backdrop-blur-md px-6 text-center transition-opacity duration-500">
    <div class="w-14 h-14 mb-4 rounded-full bg-emerald-500/10 border border-lime-300/40 flex items-center justify-center shadow-[0_0_30px_rgba(132,204,22,0.25)]">

    </div>

    <h1 class="font-museum text-3xl sm:text-4xl text-stone-100 tracking-wide mb-2">Pasillo Surrealista</h1>
    <p id="loading-message" class="text-xs text-stone-400 max-w-xs mb-6 leading-relaxed">Decodificando arquitectura, escultura y artefacto dorado...</p>
    <div id="progress-container" class="w-64 flex flex-col items-center mb-5">
      <div class="w-full h-1.5 bg-stone-800 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-500 via-lime-400 to-yellow-300 w-0 transition-all duration-200"></div>
      </div>
      <span id="progress-text" class="text-[10px] font-mono text-lime-300/80 mt-2">0%</span>
    </div>
    <div id="launch-controls" class="hidden flex-col gap-3 w-full max-w-xs">
      <button id="btn-start-preview" class="magic-cta w-full py-4 px-7 rounded-full text-stone-950 font-extrabold text-xs uppercase tracking-widest flex items-center justify-center gap-2">
        <span>Explorar Sala Ahora</span>
      </button>
    </div>

  <!-- INTERFAZ DE CONTROL Y LANZAMIENTO VR / AR -->
  <div id="hud-overlay">
    <header class="w-full flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 bg-stone-950/85 border border-lime-400/35 rounded-full px-4 py-2 shadow-lg">
        <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-lime-400 animate-pulse"></span>
        <span id="status-text" class="text-[11px] font-medium text-stone-100">Sala activa · Busca el artefacto oculto al fondo</span>
      </div>
      <div class="interactive flex items-center gap-2">
        <button id="btn-replay-magic" class="px-3.5 py-2 rounded-full bg-stone-950/85 border border-yellow-300/40 text-yellow-200 text-[11px] font-medium active:scale-95 transition-transform">✨ Materializar Hojas</button>
      </div>
    </header>

    <footer class="w-full flex flex-col items-center gap-3">
      <div class="interactive flex flex-wrap items-center justify-center gap-2.5 w-full max-w-md">
        <button id="btn-enter-vr" class="magic-cta flex-1 min-w-[165px] py-3.5 px-5 rounded-full text-stone-950 font-extrabold text-xs uppercase tracking-wider flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span>Entrar en VR (Quest 3)</span>
        </button>
        <button id="btn-enter-ar" class="magic-btn flex-1 min-w-[165px] py-3.5 px-5 rounded-full text-lime-200 font-semibold text-xs uppercase tracking-wider flex items-center justify-center gap-2">Modo AR (Passthrough)</button>
        <!-- Fallback iOS -->
        <button id="btn-enter-ar-ios" class="hidden magic-btn flex-1 min-w-[165px] py-3.5 px-5 rounded-full text-lime-200 font-semibold text-xs uppercase tracking-wider flex items-center justify-center gap-2">AR (iOS Quick Look)</button>
      </div>

      <div class="interactive flex items-center justify-center gap-3 w-full max-w-sm">
        <button id="btn-step-back" class="magic-btn flex-1 py-3 px-4 rounded-2xl flex items-center justify-center gap-2 text-lime-100 text-xs font-semibold tracking-wider uppercase"><span>↓ Atrás</span></button>
        <button id="btn-reset-walk" title="Volver a la entrada" class="px-4 py-2 rounded-2xl bg-stone-950/90 border border-yellow-300/40 flex flex-col items-center justify-center min-w-[92px] shadow-inner active:scale-95 transition-transform">
          <span class="text-[9px] uppercase tracking-widest text-lime-300/80">Recorrido</span>
          <span id="distance-readout" class="text-sm font-mono font-bold text-yellow-300">0.0 m</span>
        </button>
        <button id="btn-step-forward" class="magic-btn flex-1 py-3 px-4 rounded-2xl flex items-center justify-center gap-2 text-yellow-200 text-xs font-semibold tracking-wider uppercase"><span>Avanzar ↑</span></button>
      </div>
    </footer>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    const REPO_RAW_BASE = './';
    const MODELS = {
      corridor: `${REPO_RAW_BASE}models/pasillo_optimizado.glb`,
      sculpture: `${REPO_RAW_BASE}models/escultura_felina_webAR_optimizado.glb`,
      gyroscope: `${REPO_RAW_BASE}models/goldengirosc_optimizado.glb`
    };
    const AUDIO_NARRATION_URL = `${REPO_RAW_BASE}audio/leonora_narracion.mp3`;

    // Frases de respaldo (Web Speech API) si aún no subes audio/leonora_narracion.mp3
    const LEONORA_QUOTES = [
      'El guardián felino despierta en el umbral del sueño.',
      'Como decía Leonora Carrington: el mundo que imaginamos es tan real como el que pisamos.',
      'El oro del alquimista no habita en la piedra, sino en quien se atreve a mirar más allá del espejo.',
      'Bienvenido al pasillo de lo maravilloso.'
    ];

    const ARTIFACT_STATE = {
      EXPLORACION: 0,
      PORTANDO: 1,
      ACTIVADO: 2
    };

    let scene, camera, renderer, gltfLoader;
    let hallAnchorGroup, walkStageGroup, interiorGroup;
    let clippingPlane, leafParticles, leafMaterial, magicWaveRing, magicWaveLight;
    let fireflies, fireflyMaterial;

    // Entidades de la dinámica del artefacto y despertar
    let sculptureGroup = null;
    let sculptureLocalBox = new THREE.Box3();
    let sculptureCenterLocal = new THREE.Vector3();
    let sculptureOrbitRadius = 0.95;
    let sculptureLight = null;
    let sculptureAwakenLight = null;
    const sculptureMaterialStates = [];

    let gyroGroup = null;
    let gyroModel = null;
    let gyroHitSphere = null;
    let gyroLight = null;
    let gyroRestPosition = new THREE.Vector3();
    const gyroMaterials = [];

    let awakenParticles = null;
    let awakenParticleMat = null;

    let artifactState = ARTIFACT_STATE.EXPLORACION;
    let carryingMode = null; // 'xr' | 'camera' | null
    let carryingController = null;
    let orbitAngle = 0;
    let awakeningT = 0;
    let lastHapticTime = 0;

    const controllers = [];
    const controllerLines = [];
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();

    let isMaterializing = false;
    let materializationT = 0;
    let maxRevealHeight = 10.8;
    let totalCorridorLength = 14.0;
    let lastFrameTime = performance.now();

    const targetWalkOffset = new THREE.Vector3(0, 0, 0);
    const currentWalkOffset = new THREE.Vector3(0, 0, 0);
    let moveButtonDir = 0;
    let buttonCooldown = 0;
    const keysPressed = { forward: false, back: false, left: false, right: false };

    let isPointerDown = false;
    let pointerDownX = 0;
    let pointerDownY = 0;
    let prevPointerX = 0;
    let prevPointerY = 0;
    let yaw = 0;
    let pitch = 0;

    // Vectores y matrices reutilizables (cero GC en renderLoop)
    const _rayDir = new THREE.Vector3();
    const _horizDir = new THREE.Vector3();
    const _localForward = new THREE.Vector3();
    const _localRight = new THREE.Vector3();
    const _invAnchorQuat = new THREE.Quaternion();
    const _tempMatrix = new THREE.Matrix4();
    const _tempVecA = new THREE.Vector3();
    const _tempVecB = new THREE.Vector3();
    const _goldColor = new THREE.Color(0xfbbf24);

    // Motor de audio (Web Audio API + Audio Posicional/MP3 + Fallback Web Speech)
    let audioCtx = null;
    let audioListener = null;
    let positionalAudio = null;
    let narrationAudioLoaded = false;

    const hudOverlay = document.getElementById('hud-overlay');
    const loadingModal = document.getElementById('loading-modal');
    const launchControls = document.getElementById('launch-controls');
    const btnStartPreview = document.getElementById('btn-start-preview');
    const btnEnterVR = document.getElementById('btn-enter-vr');
    const btnEnterAR = document.getElementById('btn-enter-ar');
    const btnEnterARIos = document.getElementById('btn-enter-ar-ios');
    const btnReplayMagic = document.getElementById('btn-replay-magic');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    const btnStepForward = document.getElementById('btn-step-forward');
    const btnStepBack = document.getElementById('btn-step-back');
    const btnResetWalk = document.getElementById('btn-reset-walk');
    const distanceReadout = document.getElementById('distance-readout');
    const toastBanner = document.getElementById('toast-banner');

    function showToast(msg, duration = 3400) {
      toastBanner.textContent = msg;
      toastBanner.style.opacity = '1';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { toastBanner.style.opacity = '0'; }, duration);
    }

    // --- MOTOR DE AUDIO MÍSTICO Y NARRACIÓN ---
    function unlockAudio() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx && AudioContextClass) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      if (audioListener && audioListener.context && audioListener.context.state === 'suspended') {
        audioListener.context.resume().catch(() => {});
      }
    }

    function playPickupChime() {
      unlockAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const notes = [587.33, 739.99, 880.0, 1174.66]; // D5, F#5, A5, D6
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.065);
        gain.gain.setValueAtTime(0.0001, now + idx * 0.065);
        gain.gain.exponentialRampToValueAtTime(0.08, now + idx * 0.065 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.065 + 0.85);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.065);
        osc.stop(now + idx * 0.065 + 0.9);
      });
    }

    function playAwakeningChord() {
      unlockAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const freqs = [146.83, 220.0, 293.66, 369.99, 554.37, 659.25]; // Acorde Dmaj9 místico
      freqs.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = i < 2 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(i < 2 ? 0.055 : 0.038, now + 1.1);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 6.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 6.4);
      });
    }

    function setupPositionalNarration() {
      audioListener = new THREE.AudioListener();
      camera.add(audioListener);
      positionalAudio = new THREE.PositionalAudio(audioListener);
      positionalAudio.setRefDistance(2.2);
      positionalAudio.setMaxDistance(16.0);
      positionalAudio.setRolloffFactor(1.1);

      const audioLoader = new THREE.AudioLoader();
      audioLoader.load(
        AUDIO_NARRATION_URL,
        (buffer) => {
          positionalAudio.setBuffer(buffer);
          positionalAudio.setVolume(0.95);
          narrationAudioLoaded = true;
        },
        undefined,
        () => {
          // Sin archivo MP3 aún: se usará el narrador Web Speech API automáticamente
          narrationAudioLoaded = false;
        }
      );
    }

    function playLeonoraNarration() {
      unlockAudio();
      if (narrationAudioLoaded && positionalAudio && positionalAudio.buffer) {
        if (positionalAudio.isPlaying) positionalAudio.stop();
        positionalAudio.play();
        return;
      }
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(LEONORA_QUOTES.join(' '));
          utterance.lang = 'es-MX';
          utterance.rate = 0.88;
          utterance.pitch = 0.96;
          const voices = window.speechSynthesis.getVoices();
          const preferred = voices.find((v) => v.lang.startsWith('es') && /paulina|monica|helena|sabina|google/i.test(v.name))
            || voices.find((v) => v.lang.startsWith('es'));
          if (preferred) utterance.voice = preferred;
          window.speechSynthesis.speak(utterance);
        } catch (err) {
          console.warn('Narración no disponible:', err);
        }
      }
    }

    function triggerHaptic(controller, intensity = 0.5, duration = 80) {
      const session = renderer.xr.getSession();
      if (!session || !controller) return;
      const idx = controllers.indexOf(controller);
      const source = session.inputSources[idx];
      const actuator = source?.gamepad?.hapticActuators?.[0];
      if (actuator && typeof actuator.pulse === 'function') {
        actuator.pulse(intensity, duration).catch(() => {});
      }
    }

    init();

    async function init() {
      const container = document.getElementById('webgl-viewport');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050a08);
      scene.fog = new THREE.FogExp2(0x050a08, 0.018);

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 120);
      camera.position.set(0, 1.65, 1.2);
      camera.rotation.order = 'YXZ';
      scene.add(camera);

      setupPositionalNarration();

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      if (typeof renderer.xr.setFoveation === 'function') renderer.xr.setFoveation(0.85);
      renderer.localClippingEnabled = false;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.22;
      container.appendChild(renderer.domElement);

      setupLighting();
      setupQuestControllers();

      hallAnchorGroup = new THREE.Group();
      hallAnchorGroup.position.set(0, 0, 0);
      hallAnchorGroup.visible = true;
      scene.add(hallAnchorGroup);

      walkStageGroup = new THREE.Group();
      hallAnchorGroup.add(walkStageGroup);

      interiorGroup = new THREE.Group();
      walkStageGroup.add(interiorGroup);

      setupMagicalLeafMaterialization();
      setupFireflies();
      await loadModelsParallel();

      setupUIAndDesktopControls();
      detectARSupport();

      window.addEventListener('resize', () => {
        if (!renderer.xr.isPresenting) {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }
      });

      lastFrameTime = performance.now();
      renderer.setAnimationLoop(renderLoop);
    }

    function setupLighting() {
      const ambientLight = new THREE.AmbientLight(0xd9f99d, 0.85);
      scene.add(ambientLight);
      const hemiLight = new THREE.HemisphereLight(0xfef9c3, 0x14532d, 1.65);
      hemiLight.position.set(0, 12, 0);
      scene.add(hemiLight);
      const dirLight = new THREE.DirectionalLight(0xfffbeb, 2.0);
      dirLight.position.set(4, 14, 6);
      scene.add(dirLight);
    }

    function setupQuestControllers() {
      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -3.5)
      ]);
      for (let i = 0; i < 2; i++) {
        const controller = renderer.xr.getController(i);
        const lineMat = new THREE.LineBasicMaterial({ color: 0xa3e635, transparent: true, opacity: 0.45 });
        const line = new THREE.Line(lineGeo, lineMat);
        controller.add(line);

        const handleGrabAttempt = () => {
          unlockAudio();
          if (artifactState === ARTIFACT_STATE.EXPLORACION && !isMaterializing) {
            if (tryGrabGyroWithController(controller)) return true;
          }
          return false;
        };

        controller.addEventListener('selectstart', () => {
          const grabbed = handleGrabAttempt();
          if (!grabbed && artifactState === ARTIFACT_STATE.EXPLORACION) {
            // Solo re-materializa si no estaba intentando tomar el artefacto
            if (!isControllerPointingAtGyro(controller)) {
              triggerMaterializationWave();
            }
          }
        });
        controller.addEventListener('squeezestart', handleGrabAttempt);

        scene.add(controller);
        controllers.push(controller);
        controllerLines.push(line);
      }
    }

    function isControllerPointingAtGyro(controller) {
      if (!gyroHitSphere || artifactState !== ARTIFACT_STATE.EXPLORACION) return false;
      _tempMatrix.identity().extractRotation(controller.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(_tempMatrix);
      raycaster.far = 5.0;
      return raycaster.intersectObject(gyroHitSphere, false).length > 0;
    }

    function tryGrabGyroWithController(controller) {
      if (!gyroGroup || !gyroHitSphere || artifactState !== ARTIFACT_STATE.EXPLORACION) return false;

      // 1. Agarre directo por cercanía de la mano (<= 55 cm)
      controller.getWorldPosition(_tempVecA);
      gyroGroup.getWorldPosition(_tempVecB);
      const directReach = _tempVecA.distanceTo(_tempVecB) <= 0.55;

      // 2. Agarre ergonómico a distancia con rayo (evita agacharse al suelo)
      const rayHit = isControllerPointingAtGyro(controller);

      if (directReach || rayHit) {
        artifactState = ARTIFACT_STATE.PORTANDO;
        carryingMode = 'xr';
        carryingController = controller;
        playPickupChime();
        triggerHaptic(controller, 0.65, 130);
        statusDot.className = 'w-2.5 h-2.5 rounded-full bg-yellow-300 animate-ping';
        statusText.textContent = 'Artefacto en mano · Acércalo a la escultura (sigue su pulso)';
        showToast('✨ Giroscopio dorado activado · Acércalo a la escultura');
        return true;
      }
      return false;
    }

    function tryGrabGyroWithPointer(clientX, clientY) {
      if (!gyroHitSphere || artifactState !== ARTIFACT_STATE.EXPLORACION || isMaterializing) return false;
      pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
      pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);
      raycaster.far = 18.0;
      if (raycaster.intersectObject(gyroHitSphere, false).length > 0) {
        unlockAudio();
        artifactState = ARTIFACT_STATE.PORTANDO;
        carryingMode = 'camera';
        carryingController = null;
        playPickupChime();
        statusDot.className = 'w-2.5 h-2.5 rounded-full bg-yellow-300 animate-ping';
        statusText.textContent = 'Artefacto en mano · Camina hacia la escultura';
        showToast('✨ Giroscopio dorado tomado · Acércate a la escultura');
        return true;
      }
      return false;
    }

    function createRadiantLeafTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.save(); ctx.translate(64, 64);
      const aura = ctx.createRadialGradient(0, 0, 4, 0, 0, 60);
      aura.addColorStop(0, 'rgba(255, 255, 220, 0.55)');

    function setupFireflies() {
      const fireflyCount = 280;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(fireflyCount * 3);
      const seeds = new Float32Array(fireflyCount);
      const traits = new Float32Array(fireflyCount * 4);

      const fireflyPalette = [
        new THREE.Color('#efff9b'),

        new THREE.Color('#fff0a8'),
        new THREE.Color('#ffdf78'),
        new THREE.Color('#e8f58b')

      for (let i = 0; i < fireflyCount; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 4.2;
        positions[i * 3 + 1] = 0.35 + Math.random() * 5.0;
        positions[i * 3 + 2] = -Math.random() * 14.5;
        seeds[i] = Math.random() * 100.0;
        traits[i * 4] = Math.random();
        traits[i * 4 + 1] = 2.8 + Math.random() * 3.8;
        traits[i * 4 + 2] = 0.085 + Math.random() * 0.095;
        traits[i * 4 + 3] = 19.0 + Math.random() * 12.0;
        const color = fireflyPalette[Math.floor(Math.random() * fireflyPalette.length)];
        colors[i * 3] = color.r; colors[i * 3 + 1] = color.g; colors[i * 3 + 2] = color.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
      geo.setAttribute('aTraits', new THREE.BufferAttribute(traits, 4));
      geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));

      fireflyMaterial = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
        uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() }, uOpacity: { value: 0.88 } },
        vertexShader: `
          attribute float aSeed; attribute vec4 aTraits; attribute vec3 aColor;
          uniform float uTime; uniform float uPixelRatio;
          varying float vPulse; varying vec3 vColor;
          void main() {
            vec3 pos = position; float seed = aSeed;
            pos.x += sin(uTime * 0.48 + seed * 0.73) * 0.24 + cos(uTime * 0.19 + seed * 1.31) * 0.10;
            pos.y += sin(uTime * 0.62 + seed * 0.47) * 0.17 + cos(uTime * 0.27 + seed * 1.70) * 0.08;
            pos.z += cos(uTime * 0.38 + seed * 0.91) * 0.18;
            float phase = fract(uTime / aTraits.y + aTraits.x);
            float flash = 0.0;
            if (phase < aTraits.z) {
              float pulseT = phase / max(aTraits.z, 0.001);
              flash = smoothstep(0.0, 0.12, pulseT) * (1.0 - smoothstep(0.30, 1.0, pulseT));

            vColor = aColor;
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            float apparentSize = aTraits.w * (0.78 + vPulse * 0.34);
            gl_PointSize = clamp((apparentSize * uPixelRatio) / max(-mvPosition.z, 0.70), 1.5, 26.0);
          }
        `,
        fragmentShader: `
          uniform float uOpacity;
          varying float vPulse; varying vec3 vColor;
          void main() {
            vec2 p = (gl_PointCoord - vec2(0.5)) * 2.0; float dist = length(p);

      fireflies = new THREE.Points(geo, fireflyMaterial);
      fireflies.frustumCulled = false;
      fireflies.visible = false;
      fireflies.renderOrder = 2;
      walkStageGroup.add(fireflies);
    }

    // Partículas doradas ascendentes alrededor de la escultura al despertar (1 draw call)
    function setupAwakeningParticles(centerLocal, radiusXZ, height) {
      const count = 160;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const seeds = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = 0.25 + Math.random() * (radiusXZ + 0.55);
        positions[i * 3] = centerLocal.x + Math.cos(angle) * r;
        positions[i * 3 + 1] = Math.random() * (height + 0.8);
        positions[i * 3 + 2] = centerLocal.z + Math.sin(angle) * r;
        seeds[i * 3] = Math.random() * Math.PI * 2;
        seeds[i * 3 + 1] = 0.35 + Math.random() * 0.65;
        seeds[i * 3 + 2] = 14.0 + Math.random() * 16.0;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 3));

      awakenParticleMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
        uniforms: {
          uTime: { value: 0 },
          uIntensity: { value: 0 },
          uMaxY: { value: height + 1.0 },
          uPixelRatio: { value: renderer.getPixelRatio() }
        },
        vertexShader: `
          attribute vec3 aSeed;
          uniform float uTime; uniform float uIntensity; uniform float uMaxY; uniform float uPixelRatio;
          varying float vAlpha;
          void main() {
            vec3 pos = position;
            float phase = aSeed.x; float speed = aSeed.y;
            pos.y = mod(pos.y + uTime * speed * 0.65, uMaxY);
            float swirl = uTime * 0.9 + phase;
            pos.x += cos(swirl) * 0.12;
            pos.z += sin(swirl) * 0.12;
            float heightFade = smoothstep(0.0, 0.35, pos.y) * (1.0 - smoothstep(uMaxY * 0.72, uMaxY, pos.y));
            float twinkle = 0.6 + 0.4 * sin(uTime * 5.0 + phase * 3.0);
            vAlpha = heightFade * twinkle * uIntensity;
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            gl_PointSize = clamp((aSeed.z * uPixelRatio) / max(-mvPosition.z, 0.5), 2.0, 28.0);
          }
        `,
        fragmentShader: `
          varying float vAlpha;
          void main() {
            vec2 p = (gl_PointCoord - vec2(0.5)) * 2.0;
            float d = length(p);
            float core = exp(-d * d * 5.5);
            if (core * vAlpha < 0.01) discard;
            vec3 col = mix(vec3(1.0, 0.76, 0.18), vec3(1.0, 0.98, 0.82), core);
            gl_FragColor = vec4(col * 1.45, core * vAlpha);
          }
        `
      });

      awakenParticles = new THREE.Points(geo, awakenParticleMat);
      awakenParticles.frustumCulled = false;
      awakenParticles.visible = false;
      interiorGroup.add(awakenParticles);
    }

    function fixCorridorMaterial(mat, maxAnisotropy) {
      if (!mat) return;
      const name = (mat.name || '').toLowerCase();
      const cutoutNames = ['alexandrapalm', 'wild bush', 'plantas', 'plant.leaf', 'rejapared', 'leaves', 'orchid', 'sepal'];
      const isCutout = cutoutNames.some(k => name.includes(k));
      if (isCutout) { mat.transparent = false; mat.alphaTest = 0.42; mat.depthWrite = true; mat.side = THREE.DoubleSide; }
      else { mat.transparent = false; mat.alphaTest = 0; mat.depthWrite = true; mat.side = THREE.FrontSide; }
      ['map', 'normalMap', 'roughnessMap', 'metalnessMap'].forEach((mapKey) => { if (mat[mapKey]) mat[mapKey].anisotropy = maxAnisotropy; });
    }

    async function loadModelsParallel() {
      await MeshoptDecoder.ready;
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      gltfLoader = new GLTFLoader();
      gltfLoader.setDRACOLoader(dracoLoader);
      gltfLoader.setMeshoptDecoder(MeshoptDecoder);

      const progressMap = { corridor: 0, sculpture: 0, gyroscope: 0 };
      const updateUIProgress = () => {
        const total = Math.min(99, Math.round((progressMap.corridor * 0.65) + (progressMap.sculpture * 0.25) + (progressMap.gyroscope * 0.10)));
        document.getElementById('progress-bar').style.width = total + '%';
        document.getElementById('progress-text').textContent = total + '%';
      };

      const loadWithProgress = (url, key) => new Promise((resolve, reject) => {
        gltfLoader.load(url, (gltf) => { progressMap[key] = 100; updateUIProgress(); resolve(gltf); },
          (xhr) => { if (xhr.total > 0) { progressMap[key] = (xhr.loaded / xhr.total) * 100; updateUIProgress(); } }, reject);
      });

      try {
        const [gltfCorridor, gltfSculpture, gltfGyro] = await Promise.all([
          loadWithProgress(MODELS.corridor, 'corridor'),
          loadWithProgress(MODELS.sculpture, 'sculpture'),
          loadWithProgress(MODELS.gyroscope, 'gyroscope')
        ]);

        // 1. PASILLO
        const corridor = gltfCorridor.scene;
        corridor.scale.setScalar(5.2);
        corridor.updateMatrixWorld(true);
        const pisoSlabBox = new THREE.Box3(); const wallBox = new THREE.Box3();
        let hasPisoSlab = false; let hasWallMesh = false;
        corridor.traverse((node) => {
          if (node.isMesh) {
            const mName = (node.name || '').toLowerCase(); const matName = (node.material?.name || '').toLowerCase();
            if (mName.includes('pisoceart') || matName.includes('pisoceart')) { pisoSlabBox.expandByObject(node); hasPisoSlab = true; }
            if (mName.includes('muro') || matName.includes('murocear')) { wallBox.expandByObject(node); hasWallMesh = true; }
          }
        });
        const fullCorrBox = new THREE.Box3().setFromObject(corridor);
        const refCenter = hasWallMesh ? wallBox.getCenter(new THREE.Vector3()) : fullCorrBox.getCenter(new THREE.Vector3());
        const exactFloorY = hasPisoSlab ? pisoSlabBox.min.y : fullCorrBox.min.y;
        const entranceZ = hasWallMesh ? wallBox.max.z : fullCorrBox.max.z;
        const backZ = hasWallMesh ? wallBox.min.z : fullCorrBox.min.z;
        corridor.position.set(-refCenter.x, -exactFloorY, -entranceZ);
        corridor.updateMatrixWorld(true);
        totalCorridorLength = Math.abs(entranceZ - backZ);
        const corridorWidth = hasWallMesh ? (wallBox.max.x - wallBox.min.x) : (fullCorrBox.max.x - fullCorrBox.min.x);
        const sculptureZ = -(totalCorridorLength * 0.46);

        // 2. ESCULTURA FELINA
        const sculpture = gltfSculpture.scene;
        sculptureGroup = sculpture;
        sculpture.scale.setScalar(3.2);
        sculpture.updateMatrixWorld(true);

        const sculpBox = new THREE.Box3().setFromObject(sculpture);
        const sculpCenter = sculpBox.getCenter(new THREE.Vector3());
        const lateralOffset = -1.2;

        let lowestVisibleY = Infinity;
        sculpture.traverse((child) => {
          if (child.isMesh && child.visible) {
            const posAttr = child.geometry.attributes.position;
            if (posAttr) {
              for (let i = 0; i < posAttr.count; i++) {
                const v = new THREE.Vector3(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
                v.applyMatrix4(child.matrixWorld);
                if (v.y < lowestVisibleY) lowestVisibleY = v.y;
              }
            }
          }
        });
        if (lowestVisibleY === Infinity) lowestVisibleY = sculpBox.min.y;

        sculpture.position.set(
          -sculpCenter.x + lateralOffset,
          -lowestVisibleY + 0.02,
          sculptureZ - sculpCenter.z
        );
        sculpture.updateMatrixWorld(true);

        // Guardar volumen y materiales de la escultura para el snap a 50 cm y brillo progresivo
        sculptureLocalBox.setFromObject(sculpture);
        sculptureLocalBox.getCenter(sculptureCenterLocal);
        const sculpSize = sculptureLocalBox.getSize(new THREE.Vector3());
        sculptureOrbitRadius = Math.max(0.75, Math.max(sculpSize.x, sculpSize.z) * 0.5 + 0.35);

        const seenSculpMats = new Set();
        sculpture.traverse((node) => {
          if (node.isMesh && node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((mat) => {
              if (!seenSculpMats.has(mat) && 'emissive' in mat) {
                seenSculpMats.add(mat);
                sculptureMaterialStates.push({
                  mat,
                  baseEmissive: mat.emissive.clone(),
                  baseIntensity: mat.emissiveIntensity || 0
                });
              }
            });
          }
        });

        // Anclar audio posicional en el centro de la escultura
        if (positionalAudio) {
          const audioAnchor = new THREE.Object3D();
          audioAnchor.position.copy(sculptureCenterLocal);
          interiorGroup.add(audioAnchor);
          audioAnchor.add(positionalAudio);
        }

        sculptureLight = new THREE.PointLight(0xfef08a, 2.4, 14);
        sculptureLight.position.set(lateralOffset, 2.5, sculptureZ + 1.5);

        sculptureAwakenLight = new THREE.PointLight(0xfde047, 0.0, 12);
        sculptureAwakenLight.position.set(sculptureCenterLocal.x, sculptureCenterLocal.y + 0.45, sculptureCenterLocal.z + 0.35);

        // 3. GIROSCOPIO DORADO (Fondo, esquina inferior derecha)
        gyroGroup = new THREE.Group();
        gyroModel = gltfGyro.scene;
        const rawGyroBox = new THREE.Box3().setFromObject(gyroModel);
        const rawGyroSize = rawGyroBox.getSize(new THREE.Vector3());
        const maxDim = Math.max(rawGyroSize.x, rawGyroSize.y, rawGyroSize.z) || 1;
        const targetGyroSize = 0.28; // 28 cm (escala ergonómica en mano VR)
        gyroModel.scale.setScalar(targetGyroSize / maxDim);
        gyroModel.updateMatrixWorld(true);

        const centeredGyroBox = new THREE.Box3().setFromObject(gyroModel);
        const centeredGyroCenter = centeredGyroBox.getCenter(new THREE.Vector3());
        gyroModel.position.sub(centeredGyroCenter);
        gyroGroup.add(gyroModel);

        // Esfera invisible generosa para facilitar el agarre con rayo o toque en pantalla
        const hitGeo = new THREE.SphereGeometry(0.42, 12, 12);
        const hitMat = new THREE.MeshBasicMaterial({ visible: false });
        gyroHitSphere = new THREE.Mesh(hitGeo, hitMat);
        gyroGroup.add(gyroHitSphere);

        // Destello dorado sutil para pista diegética en la esquina y modo brújula
        gyroLight = new THREE.PointLight(0xfacc15, 0.9, 3.8);
        gyroGroup.add(gyroLight);

        const seenGyroMats = new Set();
        gyroModel.traverse((node) => {
          if (node.isMesh && node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((mat) => {
              if (!seenGyroMats.has(mat) && 'emissive' in mat) {
                seenGyroMats.add(mat);
                mat.emissive.copy(_goldColor);
                mat.emissiveIntensity = 0.22;
                gyroMaterials.push(mat);
              }
            });
          }
        });

        // Posición exacta: fondo del pasillo, esquina inferior derecha (sin chocar con muro ni hundirse)
        const rightCornerX = THREE.MathUtils.clamp((corridorWidth * 0.5) - 0.65, 0.95, 1.55);
        const farCornerZ = -(totalCorridorLength - 1.35);
        gyroRestPosition.set(rightCornerX, 0.26, farCornerZ);
        gyroGroup.position.copy(gyroRestPosition);

        interiorGroup.add(corridor, sculpture, sculptureLight, sculptureAwakenLight, gyroGroup);
        setupAwakeningParticles(sculptureCenterLocal, sculptureOrbitRadius, sculpSize.y);

        const combinedBox = new THREE.Box3().setFromObject(interiorGroup);
        maxRevealHeight = Math.max(10.5, combinedBox.max.y + 0.6);
        leafMaterial.uniforms.uMaxHeight.value = maxRevealHeight;
        magicWaveRing.position.set(0, 0.1, sculptureZ * 0.65);

        const maxAniso = Math.min(4, renderer.capabilities.getMaxAnisotropy());
        const processedMaterials = new Set();
        interiorGroup.traverse((node) => {
          node.frustumCulled = false;
          if (node.isMesh && node.material && node !== gyroHitSphere) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((mat) => {
              if (!processedMaterials.has(mat)) {
                fixCorridorMaterial(mat, maxAniso);
                mat.clippingPlanes = [clippingPlane];
                mat.needsUpdate = true;
                processedMaterials.add(mat);
              }
            });
          }
        });

        dracoLoader.dispose();

        document.getElementById('progress-bar').style.width = '100%';
        document.getElementById('progress-text').textContent = '100%';
        document.getElementById('progress-container').classList.add('hidden');
        document.getElementById('loading-message').textContent = '¡Pasillo, Escultura y Artefacto listos!';
        launchControls.classList.remove('hidden');
        launchControls.classList.add('flex');
        triggerMaterializationWave();
      } catch (e) {
        console.error('Error cargando modelos:', e);
        document.getElementById('loading-message').textContent = 'Error al cargar modelos GLB. Verifica tu conexión.';
      }
    }

    function activateSculptureAwakening() {
      artifactState = ARTIFACT_STATE.ACTIVADO;
      awakeningT = 0;

      // Ángulo inicial de órbita continuo desde la posición exacta donde llegó el giroscopio
      orbitAngle = Math.atan2(
        gyroGroup.position.z - sculptureCenterLocal.z,
        gyroGroup.position.x - sculptureCenterLocal.x
      );

      if (carryingController) {
        triggerHaptic(carryingController, 0.9, 260);
      }
      carryingMode = null;
      carryingController = null;

      if (awakenParticles) awakenParticles.visible = true;

      playAwakeningChord();
      playLeonoraNarration();

      statusDot.className = 'w-2.5 h-2.5 rounded-full bg-amber-300 shadow-[0_0_12px_#fcd34d]';
      statusText.textContent = 'Escultura despierta · Escuchando a Leonora Carrington';
      showToast('✨ La escultura despierta · Escucha la historia', 4800);
    }

    function updateArtifactAndAwakening(dt, timeSec) {
      if (!gyroGroup || !gyroModel) return;

      // Resaltar rayo del control Quest en dorado al apuntar al giroscopio
      if (renderer.xr.isPresenting && artifactState === ARTIFACT_STATE.EXPLORACION) {
        for (let i = 0; i < controllers.length; i++) {
          const pointing = isControllerPointingAtGyro(controllers[i]);
          controllerLines[i].material.color.setHex(pointing ? 0xfde047 : 0xa3e635);
          controllerLines[i].material.opacity = pointing ? 0.92 : 0.45;
        }
      }

      if (artifactState === ARTIFACT_STATE.EXPLORACION) {
        // Pista diegética: levitación muy suave, rotación pausada y destello cálido
        gyroGroup.position.set(
          gyroRestPosition.x,
          gyroRestPosition.y + Math.sin(timeSec * 1.9) * 0.045,
          gyroRestPosition.z
        );
        gyroModel.rotation.y += dt * 0.95;
        gyroModel.rotation.x = Math.sin(timeSec * 1.2) * 0.18;
        const pulse = 0.5 + 0.5 * Math.sin(timeSec * 2.6);
        gyroLight.intensity = 0.65 + pulse * 0.75;
        for (const mat of gyroMaterials) mat.emissiveIntensity = 0.2 + pulse * 0.3;
        return;
      }

      if (artifactState === ARTIFACT_STATE.PORTANDO) {
        // Calcular posición objetivo en mundo y pasarla al espacio local de interiorGroup
        if (carryingMode === 'xr' && carryingController) {
          carryingController.getWorldPosition(_tempVecA);
          _tempMatrix.identity().extractRotation(carryingController.matrixWorld);
          _tempVecB.set(0, 0.04, -0.14).applyMatrix4(_tempMatrix);
          _tempVecA.add(_tempVecB);
        } else {
          const activeCam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
          _tempVecA.set(0.24, -0.20, -0.58).applyMatrix4(activeCam.matrixWorld);
        }

        interiorGroup.worldToLocal(_tempVecA);
        gyroGroup.position.lerp(_tempVecA, Math.min(1, dt * 11.0));

        // Brújula intuitiva: distancia real en metros al volumen de la escultura
        const distMeters = sculptureLocalBox.distanceToPoint(gyroGroup.position);
        const proximity = THREE.MathUtils.clamp(1.0 - (distMeters - 0.5) / 7.5, 0.0, 1.0);

        // Aceleración de giro y pulso luminoso proporcional a la cercanía
        const spinSpeed = 1.8 + proximity * 10.5;
        gyroModel.rotation.y += dt * spinSpeed;
        gyroModel.rotation.x += dt * (0.6 + proximity * 4.2);
        gyroModel.rotation.z += dt * (0.3 + proximity * 2.5);

        const compassPulse = 0.5 + 0.5 * Math.sin(timeSec * (3.5 + proximity * 11.0));
        gyroLight.intensity = 1.0 + proximity * 3.2 + compassPulse * (0.4 + proximity * 1.1);
        for (const mat of gyroMaterials) {
          mat.emissiveIntensity = 0.35 + proximity * 1.35 + compassPulse * 0.35;
        }

        // Micro-pulsos hápticos en Quest al entrar en zona cálida (< 2.0 m)
        if (carryingController && distMeters < 2.0 && (timeSec - lastHapticTime) > (0.45 - proximity * 0.25)) {
          lastHapticTime = timeSec;
          triggerHaptic(carryingController, 0.15 + proximity * 0.35, 40);
        }

        // Anclaje mágico a 50 cm (0.50 m) de la escultura
        if (distMeters <= 0.50) {
          activateSculptureAwakening();
        }
        return;
      }

      if (artifactState === ARTIFACT_STATE.ACTIVADO) {
        // Órbita lenta y suave alrededor de la escultura
        orbitAngle += dt * 0.52;
        const targetX = sculptureCenterLocal.x + Math.cos(orbitAngle) * sculptureOrbitRadius;
        const targetZ = sculptureCenterLocal.z + Math.sin(orbitAngle) * sculptureOrbitRadius;
        const targetY = sculptureCenterLocal.y + 0.22 + Math.sin(timeSec * 1.35) * 0.16;

        _tempVecA.set(targetX, targetY, targetZ);
        gyroGroup.position.lerp(_tempVecA, Math.min(1, dt * 3.2));

        gyroModel.rotation.y += dt * 2.4;
        gyroModel.rotation.x += dt * 0.9;

        // Despertar luminoso progresivo de la escultura (rampa suave ~2.2 s + respiración dorada)
        awakeningT = Math.min(1.0, awakeningT + dt * 0.45);
        const eased = 1.0 - Math.pow(1.0 - awakeningT, 3);
        const breath = 0.5 + 0.5 * Math.sin(timeSec * 2.1);

        gyroLight.intensity = 2.6 + breath * 0.9;
        for (const mat of gyroMaterials) mat.emissiveIntensity = 1.15 + breath * 0.35;

        if (sculptureAwakenLight) {
          sculptureAwakenLight.intensity = eased * (5.2 + breath * 1.4);
        }
        if (sculptureLight) {
          sculptureLight.intensity = 2.4 + eased * 1.8;
        }

        for (const state of sculptureMaterialStates) {
          state.mat.emissive.copy(state.baseEmissive).lerp(_goldColor, eased * 0.85);
          state.mat.emissiveIntensity = state.baseIntensity + eased * (0.55 + breath * 0.18);
        }

        if (awakenParticleMat) {
          awakenParticleMat.uniforms.uTime.value = timeSec;
          awakenParticleMat.uniforms.uIntensity.value = eased * 0.95;
        }
      }
    }

    function triggerMaterializationWave() {
      renderer.localClippingEnabled = true;
      isMaterializing = true;
      materializationT = 0;
      clippingPlane.constant = hallAnchorGroup.position.y + 0.05;

      leafParticles.visible = true;
      leafMaterial.uniforms.uProgress.value = 0;
      leafMaterial.uniforms.uOpacity.value = 1.0;

      fireflies.visible = false;

      magicWaveRing.visible = true;
      magicWaveRing.material.opacity = 0.85;
      magicWaveLight.intensity = 4.5;
      showToast('✨ Materializando Pasillo y Escultura...');
    }

    function setupUIAndDesktopControls() {
      btnStartPreview.addEventListener('click', () => {
        unlockAudio();
        loadingModal.classList.add('hidden');
        hudOverlay.classList.add('active');
        triggerMaterializationWave();
      });
      btnReplayMagic.addEventListener('click', () => {
        unlockAudio();
        triggerMaterializationWave();
      });
      btnEnterVR.addEventListener('click', () => { unlockAudio(); startXRSession('immersive-vr'); });
      btnEnterAR.addEventListener('click', () => { unlockAudio(); startXRSession('immersive-ar'); });

      btnEnterARIos.addEventListener('click', () => {
        unlockAudio();
        showToast('En iOS, usa el modo 3D o instala WebXR. Abriendo vista 3D...');
        loadingModal.classList.add('hidden');
        hudOverlay.classList.add('active');
      });

      const bindWalkButton = (btn, dir) => {
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault(); unlockAudio(); btn.classList.add('pressing'); moveButtonDir = dir;
          advanceAlongViewDirection(dir * 1.6, 0);
        });
        const stopPress = () => { btn.classList.remove('pressing'); if (moveButtonDir === dir) moveButtonDir = 0; };
        btn.addEventListener('pointerup', stopPress); btn.addEventListener('pointerleave', stopPress); btn.addEventListener('pointercancel', stopPress);
      };
      bindWalkButton(btnStepForward, 1); bindWalkButton(btnStepBack, -1);
      btnResetWalk.addEventListener('click', () => { targetWalkOffset.set(0, 0, 0); showToast('Regresando a la entrada del pasillo'); });

      const viewport = document.getElementById('webgl-viewport');
      viewport.addEventListener('pointerdown', (e) => {
        unlockAudio();
        isPointerDown = true;
        pointerDownX = prevPointerX = e.clientX;
        pointerDownY = prevPointerY = e.clientY;
      });
      window.addEventListener('pointermove', (e) => {
        if (!isPointerDown || renderer.xr.isPresenting) return;
        const dx = e.clientX - prevPointerX; const dy = e.clientY - prevPointerY;
        prevPointerX = e.clientX; prevPointerY = e.clientY;
        yaw -= dx * 0.0045; pitch = THREE.MathUtils.clamp(pitch - dy * 0.0045, -1.1, 1.1);
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
      });
      window.addEventListener('pointerup', (e) => {
        if (isPointerDown && !renderer.xr.isPresenting) {
          const moved = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
          if (moved < 8) {
            tryGrabGyroWithPointer(e.clientX, e.clientY);
          }
        }
        isPointerDown = false;
      });

      window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'w' || e.key === 'ArrowUp') keysPressed.forward = true;
        if (k === 's' || e.key === 'ArrowDown') keysPressed.back = true;
        if (k === 'a' || e.key === 'ArrowLeft') keysPressed.left = true;
        if (k === 'd' || e.key === 'ArrowRight') keysPressed.right = true;
      });
      window.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'w' || e.key === 'ArrowUp') keysPressed.forward = false;
        if (k === 's' || e.key === 'ArrowDown') keysPressed.back = false;
        if (k === 'a' || e.key === 'ArrowLeft') keysPressed.left = false;
        if (k === 'd' || e.key === 'ArrowRight') keysPressed.right = false;
      });
    }

    function detectARSupport() {
      if (navigator.xr && navigator.xr.isSessionSupported) {
        navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
          if (!supported) {
            btnEnterAR.classList.add('hidden');
            btnEnterARIos.classList.remove('hidden');
          }
        }).catch(() => {
          btnEnterAR.classList.add('hidden');
          btnEnterARIos.classList.remove('hidden');
        });
      } else {
        btnEnterAR.classList.add('hidden');
        btnEnterARIos.classList.remove('hidden');
      }
    }

    function advanceAlongViewDirection(forwardMeters, strafeMeters = 0) {
      const activeCam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
      activeCam.getWorldDirection(_rayDir);
      _horizDir.set(_rayDir.x, 0, _rayDir.z);
      if (_horizDir.lengthSq() < 0.001) _horizDir.set(0, 0, -1); else _horizDir.normalize();
      _invAnchorQuat.copy(hallAnchorGroup.quaternion).invert();
      _localForward.copy(_horizDir).applyQuaternion(_invAnchorQuat); _localForward.y = 0; _localForward.normalize();
      _localRight.set(-_localForward.z, 0, _localForward.x);
      targetWalkOffset.x -= (_localForward.x * forwardMeters + _localRight.x * strafeMeters);
      targetWalkOffset.z -= (_localForward.z * forwardMeters + _localRight.z * strafeMeters);
      targetWalkOffset.x = THREE.MathUtils.clamp(targetWalkOffset.x, -1.45, 1.45);
      targetWalkOffset.z = THREE.MathUtils.clamp(targetWalkOffset.z, -10.0, totalCorridorLength + 25.0);
    }

    function processQuestThumbsticks(dt) {
      if (!renderer.xr.isPresenting) return;
      const session = renderer.xr.getSession();
      if (!session || !session.inputSources) return;
      if (buttonCooldown > 0) buttonCooldown -= dt;
      for (const source of session.inputSources) {
        if (!source.gamepad) continue;
        const gp = source.gamepad; const axes = gp.axes;
        const stickX = axes.length >= 4 ? axes[2] : (axes[0] || 0);
        const stickY = axes.length >= 4 ? axes[3] : (axes[1] || 0);
        if (Math.abs(stickY) > 0.15 || Math.abs(stickX) > 0.15) {
          if (source.handedness === 'left' || session.inputSources.length === 1) {
            advanceAlongViewDirection(-stickY * 3.8 * dt, stickX * 2.5 * dt);
          } else if (source.handedness === 'right') {
            advanceAlongViewDirection(-stickY * 3.8 * dt, 0);
            if (Math.abs(stickX) > 0.25) hallAnchorGroup.rotation.y -= stickX * 1.4 * dt;
          }
        }
        if (gp.buttons[4]?.pressed && buttonCooldown <= 0) { buttonCooldown = 0.45; targetWalkOffset.set(0, 0, 0); }
        if (gp.buttons[5]?.pressed && buttonCooldown <= 0) { buttonCooldown = 0.45; triggerMaterializationWave(); }
      }
    }

    async function startXRSession(requestedMode = 'immersive-vr') {
      loadingModal.classList.add('hidden');
      hudOverlay.classList.add('active');
      if (!navigator.xr) { showToast('WebXR no detectado en este navegador · Modo 3D activo'); return; }
      try {
        let mode = requestedMode; let supported = await navigator.xr.isSessionSupported(mode);
        if (!supported) {
          const fallback = mode === 'immersive-vr' ? 'immersive-ar' : 'immersive-vr';
          if (await navigator.xr.isSessionSupported(fallback)) { mode = fallback; supported = true; }
        }
        if (!supported) { showToast('Visor XR no conectado · Explorando en pantalla 3D'); return; }
        const session = await navigator.xr.requestSession(mode, {
          optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'dom-overlay'],
          domOverlay: { root: hudOverlay }
        });
        try { renderer.xr.setReferenceSpaceType('local-floor'); } catch (_) { renderer.xr.setReferenceSpaceType('local'); }
        await renderer.xr.setSession(session);
        if (mode === 'immersive-ar' || session.environmentBlendMode === 'alpha-blend') {
          scene.background = null; scene.fog = null;
        } else {
          scene.background = new THREE.Color(0x050a08); scene.fog = new THREE.FogExp2(0x050a08, 0.018);
        }
        hallAnchorGroup.position.set(0, 0, 0); hallAnchorGroup.visible = true;
        targetWalkOffset.set(0, 0, 0); currentWalkOffset.set(0, 0, 0);
        triggerMaterializationWave();
        session.addEventListener('end', () => {
          scene.background = new THREE.Color(0x050a08); scene.fog = new THREE.FogExp2(0x050a08, 0.018);
        });
      } catch (err) {
        console.warn('No se pudo abrir sesión XR:', err);
        showToast('Modo 3D activo en navegador');
      }
    }

    function renderLoop(timestamp) {
      const dt = Math.min(0.05, (timestamp - lastFrameTime) / 1000 || 0.016);
      lastFrameTime = timestamp;
      const timeSec = timestamp * 0.001;
      processQuestThumbsticks(dt);
      if (moveButtonDir !== 0) advanceAlongViewDirection(moveButtonDir * 4.4 * dt, 0);
      if (keysPressed.forward) advanceAlongViewDirection(4.2 * dt, 0);
      if (keysPressed.back) advanceAlongViewDirection(-4.2 * dt, 0);
      if (keysPressed.left) advanceAlongViewDirection(0, -3.2 * dt);
      if (keysPressed.right) advanceAlongViewDirection(0, 3.2 * dt);
      currentWalkOffset.lerp(targetWalkOffset, Math.min(1, dt * 8.5));
      walkStageGroup.position.set(currentWalkOffset.x, 0, currentWalkOffset.z);
      distanceReadout.textContent = `${currentWalkOffset.z.toFixed(1)} m`;

      if (isMaterializing) {
        materializationT = Math.min(1, materializationT + dt * 0.28);
        const eased = 1 - Math.pow(1 - materializationT, 3);
        const revealH = eased * maxRevealHeight;
        clippingPlane.constant = hallAnchorGroup.position.y + revealH;
        leafMaterial.uniforms.uTime.value = timeSec;
        leafMaterial.uniforms.uProgress.value = eased;
        leafMaterial.uniforms.uOpacity.value = 1.0;
        magicWaveRing.position.y = Math.min(revealH, 6.0);
        magicWaveRing.rotation.z = timeSec * 1.8;
        magicWaveRing.scale.setScalar(1.0 + Math.sin(timeSec * 5.0) * 0.12);
        magicWaveRing.material.opacity = (1.0 - materializationT) * 0.85;
        magicWaveLight.position.set(0, Math.min(revealH + 0.5, 6.5), -(totalCorridorLength * 0.42));
        magicWaveLight.intensity = (1.0 - materializationT * 0.7) * 5.0;

        if (materializationT >= 1) {
          isMaterializing = false;
          renderer.localClippingEnabled = false;
          clippingPlane.constant = 1000;
          magicWaveRing.visible = false;
          magicWaveLight.intensity = 0;

          leafParticles.visible = false;
          fireflies.visible = true;

          if (artifactState === ARTIFACT_STATE.EXPLORACION) {
            statusText.textContent = 'Pasillo materializado · Busca el objeto dorado al fondo derecha';
          }
        }
      } else if (leafParticles && leafParticles.visible) {
        leafMaterial.uniforms.uTime.value = timeSec * 0.65;
        leafMaterial.uniforms.uOpacity.value = Math.max(0.45, leafMaterial.uniforms.uOpacity.value - dt * 0.25);
      }

      if (fireflies && fireflies.visible) {
        fireflyMaterial.uniforms.uTime.value = timeSec;
      }

      updateArtifactAndAwakening(dt, timeSec);

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
